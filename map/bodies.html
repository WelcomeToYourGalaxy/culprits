<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moon, Mars and the Sun: human impact</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<!--
  The Moon, Mars and Sun views of the Culprits map (round 197o, asked 14
  October; the Sun from round 209o, asked 15 October). Opened from the map
  while NASA's Eyes on the Solar System is showing (the Moon, Mars and Sun
  buttons beside "Back to Earth"), or on its own as bodies.html#moon,
  bodies.html#mars, bodies.html#sun.

  Moon and Mars ground: NASA's Moon Trek and Mars Trek tiles, read live from
  Trek's own tile service (equirectangular, so the map uses Leaflet's plate
  carree). The Moon is LRO's wide-angle camera mosaic; Mars is the Viking
  colour mosaic, in its real colour, as the owner asked. The other looks are
  that picture recoloured.

  The Sun view is a map of the plane the planets go round in (seen from
  above, or from the side), in astronomical units, with each human-made
  object where NASA/JPL's Horizons follows it.

  Layers, built by culprits-tiles-more (scripts/bodies.py and scripts/sun.py),
  each kept as its source gives it, nothing filtered:
    everything humans put on the Moon        LROC (NASA/GSFC/ASU), PDS
    objects left on the Moon / Mars, mass    Wikipedia's two lists
    NASA's nine Artemis III regions          NASA, at the named feature's IAU centre
    Perseverance and Curiosity, live         NASA/JPL's own rover maps
    place names                              USGS / IAU gazetteer
    objects orbiting the Sun                 GCAT Heliocentric Register (CC BY), JPL Horizons
  Colours: bone, teal, cobalt, plum and rose glows; no orange, yellow or green.

  Round 209o (asked 15 October): stars behind every view; every mark drawn on
  its own, small, where it is, and a click lists every mark under the pointer;
  boxes open in a free part of the screen, never over another box, and wrap
  their text; the left box rolls up; the timeline has two ends; looks are
  Satellite, Twilight, Bioluminescent, Hologram and Hell; Layer colours as on
  the Earth map.
-->
<style>
  :root{--peat:#17150F;--bone:#DCD6C6;--dim:#948D7C;--rule:#322E27;
    --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    --obj:#E8E2D4;--obj-glow:#4FA3B8;--mass:#C98BA0;--mass-glow:#7A4E78;--plan:#7F9BE0;--plan-glow:#2F4E9A;
    --rover:#9FD0DC;--rover-glow:#2E7F96;--probe:#B9D7E6;--probe-glow:#3F7FA6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#03050A;color:var(--bone);font-family:var(--sans);overflow:hidden}
  #stars{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  #map{position:absolute;inset:0;background:transparent;z-index:1}
  .leaflet-container{background:transparent!important;font-family:var(--sans)}
  .box{position:absolute;z-index:500;background:rgba(23,21,15,.94);border:1px solid var(--rule);border-radius:3px;
    font-size:13px;line-height:1.35}
  #panel{left:16px;top:16px;width:300px;max-height:calc(100% - 32px);overflow:auto;padding:10px 12px}
  #panel .ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
  #panel.shut .pb{display:none}
  #roll{background:none;border:1px solid var(--rule);border-radius:3px;color:var(--dim);font-size:11px;line-height:1;padding:3px 6px;cursor:pointer}
  #roll:hover{color:var(--bone);border-color:var(--bone)}
  h1{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:500;margin:10px 0 4px}
  .row{display:flex;align-items:flex-start;gap:7px;padding:4px 0;border-top:1px solid var(--rule)}
  .row:first-of-type{border-top:0}
  .row input{margin:2px 0 0}
  .sw{flex:none;width:11px;height:11px;border-radius:50%;margin-top:2px}
  .row .t{flex:1}
  .row .n{color:var(--dim);font-size:11.5px;display:block}
  .live{font-size:9.5px;letter-spacing:.06em;color:#9FD0DC;border:1px solid #2E7F96;border-radius:2px;padding:0 3px;margin-left:4px}
  .note{font-size:11.5px;color:var(--dim);margin:6px 0 0}
  .note b{color:var(--bone);font-weight:500}
  details{margin-top:8px;border-top:1px solid var(--rule);padding-top:6px}
  summary{cursor:pointer;color:var(--bone);font-size:12px}
  details ul{margin:4px 0 0;padding-left:16px;font-size:11.5px;color:var(--dim)}
  .leaflet-control-attribution{background:rgba(23,21,15,.85)!important;color:var(--dim)!important;font-size:10.5px}
  .leaflet-container a{color:#9FC3DE}
  .leaflet-bar a{background:rgba(23,21,15,.94);color:var(--bone);border-color:var(--rule)}
  .leaflet-bar a:hover{background:#2A271F}
  .nm-label{background:none;border:0;box-shadow:none;color:#D6DCE4;font-size:11px;letter-spacing:.04em;
    text-shadow:0 0 4px #000;padding:0}
  .nm-label::before{display:none}
  .plan-label{color:#B9C8F0;font-size:11.5px}
  .planet-label{color:#C9D6E3;font-size:11.5px;letter-spacing:.05em}
  #globe{position:absolute;inset:0;z-index:2}
  #globe[hidden]{display:none}
  /* The box a click opens: in the free space on the right, under the looks
     box, never over another box; its text wraps, so it never scrolls sideways. */
  #info{right:16px;width:360px;overflow-y:auto;overflow-x:hidden;padding:12px 14px;z-index:600;font-size:12.5px}
  #info[hidden]{display:none}
  #info .ix{position:absolute;top:4px;right:8px;background:none;border:0;color:var(--dim);font-size:16px;cursor:pointer}
  #info h3{margin:0 18px 6px 0;font-size:14px;overflow-wrap:anywhere}
  #info table{border-collapse:collapse;width:100%;table-layout:fixed}
  #info td{vertical-align:top;padding:2px 0;border-top:1px solid var(--rule);overflow-wrap:anywhere;word-break:break-word}
  #info td:first-child{color:var(--dim);padding-right:8px;width:36%}
  #info .src{margin-top:6px;font-size:11px;color:var(--dim);overflow-wrap:anywhere}
  #info a{color:#9FC3DE;overflow-wrap:anywhere}
  #info details{margin-top:4px;padding-top:4px}
  #info details > :not(summary){margin-left:14px}
  #info .zin{margin:0 0 4px;font-size:11.5px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .from{color:var(--dim);font-size:11px}
  #body-name{font-size:17px;font-weight:600;letter-spacing:.03em;margin:0}
  /* The looks and views, set out like the Earth map's box: two columns. */
  #setbox{right:16px;top:16px;width:300px;padding:9px 12px 10px}
  body.in-frame #setbox{top:118px}
  #setbox .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
  #setbox .cols > div + div{padding-left:11px;border-left:1px solid var(--rule)}
  #setbox h1{margin:0 0 5px}
  #setbox label{display:flex;align-items:center;gap:6px;padding:2px 0;cursor:pointer;white-space:nowrap}
  #setbox input{margin:0;accent-color:#4E8FA6}
  #snap{margin-top:8px;width:100%;font:inherit;font-size:12px;color:var(--bone);background:none;border:1px solid var(--rule);
    border-radius:3px;padding:5px 6px;cursor:pointer;line-height:1.25}
  #snap:hover{border-color:var(--bone)}
  /* The timeline: two ends, so any span of years can be chosen. */
  #time{margin:8px 0 2px;padding-top:7px;border-top:1px solid var(--rule)}
  #time[hidden]{display:none}
  #time-say{font-size:12px;margin-bottom:5px}
  .dual{position:relative;height:22px}
  .dual .track{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:#3A372F}
  .dual .fill{position:absolute;top:9px;height:4px;border-radius:2px;background:#4E8FA6}
  .dual input{position:absolute;left:0;top:0;width:100%;height:22px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
  .dual input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#DCD6C6;border:2px solid #4E8FA6;cursor:pointer}
  .dual input::-moz-range-thumb{pointer-events:auto;width:12px;height:12px;border-radius:50%;background:#DCD6C6;border:2px solid #4E8FA6;cursor:pointer}
  .dual input::-webkit-slider-runnable-track{background:none}
  .dual input::-moz-range-track{background:none}
  #time .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
  /* Layer colours, as on the Earth map. */
  #colours{margin-top:8px;padding-top:7px;border-top:1px solid var(--rule)}
  #colours .cw{display:flex;gap:10px;align-items:center}
  #colours .ring{position:relative;width:96px;height:96px;flex:none}
  #colours .wheel{position:absolute;left:17px;top:17px;width:62px;height:62px;border-radius:50%;cursor:crosshair;touch-action:none;
    background:radial-gradient(circle closest-side,#8C8C88 0%,rgba(140,140,136,.55) 45%,rgba(140,140,136,0) 100%),
      conic-gradient(hsl(0,42%,50%),hsl(60,42%,50%),hsl(120,42%,50%),hsl(180,42%,50%),hsl(240,42%,50%),hsl(300,42%,50%),hsl(360,42%,50%));opacity:.75}
  #colours .wheel.on{opacity:1}
  #colours .wdot{position:absolute;width:10px;height:10px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid #E8E2D6;box-shadow:0 0 0 1px rgba(0,0,0,.6);pointer-events:none}
  #colours .pre{position:absolute;width:15px;height:15px;margin:-8px 0 0 -8px;border-radius:50%;border:1px solid rgba(0,0,0,.55);cursor:pointer;padding:0;opacity:.85}
  #colours .pre:hover,#colours .pre.on{opacity:1;box-shadow:0 0 0 2px #E8E2D6}
  #colours .side{display:flex;flex-direction:column;gap:6px;font-size:11.5px;flex:1}
  #colours .side input{width:100%;accent-color:#4E8FA6}
  #colours .chip{font:inherit;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid rgba(78,143,166,.5);background:none;color:var(--bone);cursor:pointer;align-self:flex-start}
  @media (max-width:720px){#panel{width:calc(100% - 32px);max-height:40%}#setbox{top:auto;bottom:16px;left:16px;right:16px;width:auto}
    body.in-frame #setbox{top:auto}#info{left:16px;right:16px;width:auto}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="map"></div>
<div id="globe" hidden></div>
<div class="box" id="panel">
  <div class="ph"><div id="body-name"></div><button type="button" id="roll" aria-expanded="true" title="Roll this box up or down">&#9652;</button></div>
  <div class="pb">
    <p class="note" id="globe-note"></p>
    <div id="rows"></div>
    <div id="time" hidden>
      <div id="time-say"></div>
      <div class="dual"><div class="track"></div><div class="fill" id="time-fill"></div>
        <input type="range" id="time-lo-in" step="1" aria-label="From this year">
        <input type="range" id="time-hi-in" step="1" aria-label="To this year"></div>
      <div class="ends"><span id="time-lo"></span><span id="time-hi"></span></div>
    </div>
    <div id="colours"><h1 style="margin-top:0">Layer colours</h1>
      <div class="cw"><div class="ring" id="ring"><div class="wheel" id="wheel" role="slider" tabindex="0" aria-label="Layer colours: drag round the wheel"><i class="wdot" id="wdot"></i></div></div>
        <div class="side"><label>Darker or lighter<input type="range" id="bright" min="0.5" max="1.6" step="0.05" value="1"></label>
          <button type="button" class="chip" id="drawn">As drawn</button></div></div>
    </div>
    <p class="note" id="body-note"></p>
    <details id="unplaced-box" hidden><summary id="unplaced-sum"></summary><ul id="unplaced"></ul></details>
  </div>
</div>
<div class="box" id="setbox">
  <div class="cols">
    <div><h1>Basemap</h1><div class="looks"></div></div>
    <div><h1>View</h1><div class="views"></div>
      <button type="button" id="snap">Snap back to global scale</button>
    </div>
  </div>
</div>
<div class="box" id="info" hidden><button type="button" class="ix" aria-label="Close">&#215;</button><div class="ib"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  "use strict";
  var BODIES = {
    moon: {
      name: "Moon", heading: "what people have put there, and plan to",
      tiles: "https://trek.nasa.gov/tiles/Moon/EQ/LRO_WAC_Mosaic_Global_303ppd_v02/1.0.0/default/default028mm/{z}/{y}/{x}.jpg",
      native: 8,
      ground: '<a href="https://trek.nasa.gov/moon/" target="_blank" rel="noopener">NASA Moon Trek</a>: LRO wide-angle camera mosaic (NASA/GSFC/Arizona State University)',

            "The Artemis III marks are at the centre of the feature each region is named after, because NASA has published the regions only as a picture. " +
            "The south pole, where all nine lie, is stretched sideways on this flat map.",
      rows: [
        { id: "objects", file: "moon_objects.geojson", kind: "obj", title: "Hardware spotted in orbital photos (LROC)",
          sub: "Each lander, rover, experiment, crash crater and laser reflector pinned exactly where LROC's camera sees it; no masses", name: ["SHORT_NAME", "VEHCL_NAME", "OBJECT", "MISSION"],
          credit: 'LROC, <a href="https://data.lroc.im-ldi.com/lroc/view_rdr/SHAPEFILE_ANTHROPOGENIC_OBJECTS" target="_blank" rel="noopener">Coordinates of anthropogenic features on the Moon</a>, NASA/GSFC/Arizona State University (public domain); Wagner et al. 2017, Icarus 283:92–103', on: true },
        { id: "list", file: "moon_list.geojson", kind: "mass", title: "Every mission's spacecraft, by weight (Wikipedia)",
          sub: "One mark per craft or rocket stage, sized by its mass, crashes included; places are approximate and small items are left out", credit: 'Wikipedia, <a href="https://en.wikipedia.org/wiki/List_of_artificial_objects_on_the_Moon" target="_blank" rel="noopener">List of artificial objects on the Moon</a> (CC BY-SA 4.0)', on: true },
        { id: "artemis", file: "artemis3.geojson", kind: "plan", title: "Planned crewed landing regions (NASA Artemis III)",
          sub: "Not yet built or landed on: the nine regions NASA is considering, all near the south pole", name: ["region"],
          credit: 'NASA, <a href="https://www.nasa.gov/news-release/nasa-provides-update-on-artemis-iii-moon-landing-regions/" target="_blank" rel="noopener">28 October 2024</a>; placed at IAU feature centres from the USGS Gazetteer of Planetary Nomenclature', on: true },
        { id: "names", file: "moon_names.geojson", kind: "names", title: "Place names, for finding your way (IAU)", sub: "Official names of craters, plains and mountains; more appear as you zoom in",
          credit: 'IAU names from the <a href="https://planetarynames.wr.usgs.gov/" target="_blank" rel="noopener">USGS Gazetteer of Planetary Nomenclature</a>', on: true }
      ]
    },
    mars: {
      name: "Mars", heading: "what people have put there",
      tiles: "https://trek.nasa.gov/tiles/Mars/EQ/Mars_Viking_MDIM21_ClrMosaic_global_232m/1.0.0/default/default028mm/{z}/{y}/{x}.jpg",
      native: 7,
      ground: '<a href="https://trek.nasa.gov/mars/" target="_blank" rel="noopener">NASA Mars Trek</a>: Viking colour mosaic (NASA/JPL/USGS), in its real colour',
      note: "No one keeps a count of the parachutes, heat shields, back shells and fragments spread across Mars; the Wikipedia list leaves them out and says so. " +
            "The rover routes come from NASA/JPL's own rover maps, read live each time this view opens.",
      rows: [
        { id: "list", file: "mars_list.geojson", kind: "mass", title: "Every mission's spacecraft, by weight (Wikipedia)",

          sub: "Every stop and drive since landing in Jezero crater, 2021", credit: 'NASA/JPL-Caltech, <a href="https://science.nasa.gov/mission/mars-2020-perseverance/location-map/" target="_blank" rel="noopener">Perseverance location map</a>', on: true },
        { id: "msl", rover: "MSL", kind: "rover", title: "Curiosity rover: its route and where it is now (NASA/JPL)", live: true,
          sub: "Every stop and drive since landing in Gale crater, 2012", credit: 'NASA/JPL-Caltech, <a href="https://science.nasa.gov/mission/msl-curiosity/location-map/" target="_blank" rel="noopener">Curiosity location map</a>', on: true },
        { id: "names", file: "mars_names.geojson", kind: "names", title: "Place names, for finding your way (IAU)", sub: "Official names of craters, plains and mountains; more appear as you zoom in",
          credit: 'IAU names from the <a href="https://planetarynames.wr.usgs.gov/" target="_blank" rel="noopener">USGS Gazetteer of Planetary Nomenclature</a>', on: true }
      ]
    },
    // Round 209o (asked 15 October): the Sun, and the human-made objects going
    // round it. Not a surface: a map of the plane the planets go round in,
    // seen from above (or from the side), in astronomical units.
    sun: {
      name: "Sun", plane: true, heading: "what people have sent into orbit round it",
      ground: 'Places: <a href="https://ssd.jpl.nasa.gov/horizons/" target="_blank" rel="noopener">NASA/JPL Horizons</a>; objects: <a href="https://planet4589.org/space/gcat/" target="_blank" rel="noopener">GCAT</a> (J. McDowell, CC BY)',
      note: "Each object is placed where NASA/JPL's Horizons follows it today, in the plane of Earth's orbit, in astronomical units (1 AU is Earth's distance from the Sun). Where Horizons' record ends earlier, the object is drawn as a ring at the last place it gives, and its box says when. " +
            "Objects Horizons does not follow, most spent rocket stages among them, have no published place; they are listed below the rows. Sizes of the marks are not to scale.",
      rows: [
        { id: "objects", file: "sun_objects.json", kind: "probe", title: "Human-made objects orbiting the Sun (GCAT)",
          sub: "Every probe, spent rocket stage and part in the Heliocentric Register, each column as GCAT gives it",
          credit: 'J. McDowell, <a href="https://planet4589.org/space/gcat/" target="_blank" rel="noopener">General Catalog of Artificial Space Objects</a>, Heliocentric Register (CC BY); places from <a href="https://ssd.jpl.nasa.gov/horizons/" target="_blank" rel="noopener">NASA/JPL Horizons</a>', on: true },
        { id: "planets", file: "sun_planets.json", kind: "planets", title: "The planets today, and their paths (NASA/JPL Horizons)",
          sub: "For finding your way: where each planet is today, and the path it takes round the Sun",
          credit: '<a href="https://ssd.jpl.nasa.gov/horizons/" target="_blank" rel="noopener">NASA/JPL Horizons</a>', on: true }
      ]
    }
  };

  var inFrame = window.parent !== window;
  var css = getComputedStyle(document.documentElement);
  var Craw = function (n) { return css.getPropertyValue(n).trim(); };
  var DATA = "https://welcometoyourgalaxy.github.io/culprits-tiles-more/bodies/";
  var NASA_ROVERS = "https://mars.nasa.gov/mmgis-maps/";
  var LANDED = { M20: Date.UTC(2021, 1, 18), MSL: Date.UTC(2012, 7, 6) };   // sol 0 of each rover
  var SOL = 88775244;                                                         // one Mars day, in milliseconds

  // ---------- stars behind every view, as on the Earth map ----------
  // Drawn once from a fixed seed, so they are the same at every visit.
  function starfield(w, h, n, k) {
    var cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    var g = cv.getContext("2d"), seed = 0x2F6B4A1D;
    var rnd = function () { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return ((seed >>> 0) % 100000) / 100000; };
    g.fillStyle = "#03050A"; g.fillRect(0, 0, w, h);
    for (var i = 0; i < n; i++) {
      var x = rnd() * w, y = rnd() * h, m = rnd(), r = (m > 0.985 ? 1.4 : m > 0.9 ? 0.9 : 0.55) * k, a = 0.25 + rnd() * 0.65;
      var tint = rnd(), c = tint > 0.8 ? "210,225,245" : tint > 0.65 ? "235,228,240" : "235,238,242";
      g.fillStyle = "rgba(" + c + "," + a.toFixed(2) + ")";
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
    return cv;
  }
  var STARS = starfield(2048, 1024, 2600, 1);
  function drawStars() {
    var c = document.getElementById("stars"), dpr = window.devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    var g = c.getContext("2d");
    for (var x = 0; x < c.width; x += STARS.width) for (var y = 0; y < c.height; y += STARS.height) g.drawImage(STARS, x, y);
  }
  drawStars();
  window.addEventListener("resize", drawStars);

  // ---------- Layer colours: hue, strength and brightness for every mark ----------
  // The same steps as the Earth map's Layer colours (CSS filter steps worked
  // out as one colour matrix), with ready-made settings round the wheel.
  var PRESETS = [
    ["Deep ocean", { h: 190, r: 0.7, b: 1.25 }], ["Glacier", { h: 195, r: 0.35, b: 1.5 }], ["Cobalt", { h: 225, r: 0.8, b: 1.15 }],
    ["Slate and bone", { h: 40, r: 0.06, b: 1.55 }], ["Basalt", { h: 200, r: 0.04, b: 1.4 }], ["Dusk", { h: 330, r: 0.55, b: 1.2 }],
    ["Signal", { h: 345, r: 0.8, b: 1.3 }], ["Ink", { h: 215, r: 0.8, b: 0.7 }]
  ];
  var TONE = null;      // null: as drawn
  try { TONE = JSON.parse(localStorage.getItem("bodies-colours") || "null"); } catch (e) { TONE = null; }
  function toneMatrix(t) {
    var rot = ((t.h - 200) % 360 + 540) % 360 - 180, sat = 0.1 + 1.5 * Math.max(0, Math.min(1, t.r)), br = Math.max(0.5, Math.min(1.6, t.b));
    var a = rot * Math.PI / 180, c = Math.cos(a), n = Math.sin(a);
    var H = [[0.213 + c * 0.787 - n * 0.213, 0.715 - c * 0.715 - n * 0.715, 0.072 - c * 0.072 + n * 0.928],

        var pt = function (q) { return [(VIEW === "side" ? q[2] : q[1]) * AU, q[0] * AU]; };
        L.polyline(p.path.map(pt), { renderer: canvas, color: cols.path, weight: 1, interactive: false }).addTo(routeLayer);
        var dot = L.circleMarker(pt(p.now), { renderer: canvas, radius: 3.5, stroke: true, weight: 1, color: "rgba(255,255,255,0.6)", fillColor: "#C9D6E3", fillOpacity: 1 }).addTo(routeLayer);
        // A planet is named once it stands clear of the Sun and of the planet named before it.
        var px = map.latLngToContainerPoint(pt(p.now)), sp = map.latLngToContainerPoint([0, 0]);
        if (Math.hypot(px.x - sp.x, px.y - sp.y) > 22 && named.every(function (q) { return Math.hypot(px.x - q.x, px.y - q.y) > 26; })) {
          dot.bindTooltip(esc(p.name), { permanent: true, direction: "right", className: "nm-label planet-label", offset: [6, 0] });
          named.push(px);
        }
        var d = Math.hypot(p.now[0], p.now[1], p.now[2]);
        dot.on("click", function (e) { L.DomEvent.stop(e); info("<h3>" + esc(p.name) + "</h3><p>Where NASA/JPL Horizons places it on " + esc(r.date || "") + ": " + d.toFixed(2) + " AU from the Sun. The line is its path round the Sun over one of its years.</p><div class=\"src\">" + row.credit + "</div>", e.latlng); });
      });
    });
  }
  // Names: the biggest features first, none over another.
  function drawNames() {
    nameLayer.clearLayers();
    var rows = onRows().filter(function (row) { return row.kind === "names"; });
    if (!rows.length || VIEW === "globe" || isSun()) return;
    var r = layers[rows[0].id].r, z = map.getZoom(), b = map.getBounds().pad(0.05);
    var min = z >= 8 ? 0 : 2400 / Math.pow(2, z), placed = [];
    for (var i = 0; i < r.names.length && placed.length < 200; i++) {
      var f = r.names[i], p = f.properties || {}, at = ll(f);
      if (r.dia(p) < min) break;
      if (!b.contains(at)) continue;
      var t = r.label(p), pt = map.latLngToContainerPoint(at);
      var box = [pt.x - t.length * 3.4 - 4, pt.y - 9, pt.x + t.length * 3.4 + 4, pt.y + 9];
      if (placed.some(function (q) { return box[0] < q[2] && box[2] > q[0] && box[1] < q[3] && box[3] > q[1]; })) continue;
      placed.push(box);
      L.marker(at, { icon: L.divIcon({ className: "nm-label", html: esc(t), iconSize: null, iconAnchor: [t.length * 3.4, 7] }), interactive: false, keyboard: false }).addTo(nameLayer);
    }
  }
  map.on("moveend", drawNames);

  // ---------- the globe (Moon and Mars) ----------
  var globe = null, globeTex = {};
  function loadScript(src) {
    return new Promise(function (ok, no) { var t = document.createElement("script"); t.src = src; t.onload = ok; t.onerror = no; document.head.appendChild(t); });
  }
  function globeAlt() { try { return globe.pointOfView().altitude || 2.3; } catch (e) { return 2.3; } }
  function drawGlobe() {
    if (!globe || VIEW !== "globe") return;
    var near = Math.max(0.05, globeAlt() * 0.6);   // degrees: what lies under a click
    var marks = shownMarks(), stops = shownStops(), all = marks.concat(stops);
    var deg = function (a, b) {
      var r = Math.PI / 180, x = Math.sin(a.lat * r) * Math.sin(b.lat * r) + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.cos((a.lng - b.lng) * r);
      return Math.acos(Math.max(-1, Math.min(1, x))) / r;
    };
    var pts = marks.map(function (m) {
      var s = STYLE[m.kind];
      return { lat: m.lat, lng: m.lng, r: Math.max(0.22, m.r / 12), color: C(s[0]), label: esc(m.title), m: m };
    });
    stops.forEach(function (m) { pts.push({ lat: m.lat, lng: m.lng, r: 0.1, color: C("--rover"), label: esc(m.title), m: m }); });
    pts.forEach(function (p) {
      p.html = function () { return listHtml(under(all, function (q) { return [deg(q, p.m), 0]; }, function (q) { return near + (q.kind === "stop" ? 0 : q.r / 12 * 0.5); }), true); };
    });
    var paths = [];
    onRows().forEach(function (row) {
      var r = layers[row.id].r;
      if (!r.lines) return;
      if (atEnds()) r.lines.forEach(function (l) { paths.push({ pts: l.pts, color: C("--rover") }); });
      else { var s2 = r.stops.filter(inTime).map(function (m) { return [m.lng, m.lat]; }); if (s2.length > 1) paths.push({ pts: s2, color: C("--rover") }); }
    });
    var labels = [];
    onRows().filter(function (row) { return row.kind === "names"; }).forEach(function (row) {
      var r = layers[row.id].r;
      r.names.slice(0, 90).forEach(function (f) {
        var at = ll(f), d = r.dia(f.properties || {});
        labels.push({ lat: at[0], lng: at[1], text: r.label(f.properties || {}), size: Math.max(0.5, Math.min(2.2, Math.sqrt(d) / 15)) });
      });
    });
    globe.pointsData(pts).pathsData(paths).labelsData(labels);
  }
  // The body's picture, in the look chosen: recoloured on a canvas (the same
  // filters as the flat map), with the grid drawn on where the look has one.
  function globePicture() {
    if (isSun()) return;
    var key = body + "|" + LOOK, url = DATA + body + "_globe.jpg", look = lookOf(LOOK);
    var note = document.getElementById("globe-note");
    if (globeTex[key]) { globe.globeImageUrl(globeTex[key]); return; }
    var img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = function () {
      note.textContent = "";
      if (!look[2] && !look[3]) { globeTex[key] = url; if (globe) globe.globeImageUrl(url); return; }
      var cv = document.createElement("canvas"); cv.width = 2048; cv.height = 1024;
      var ctx = cv.getContext("2d");
      if ("filter" in ctx) ctx.filter = look[2] || "none";
      ctx.drawImage(img, 0, 0, 2048, 1024);
      ctx.filter = "none";
      if (look[3]) {
        ctx.strokeStyle = look[3]; ctx.lineWidth = 1.2;
        for (var x = 0; x <= 360; x += 15) { ctx.beginPath(); ctx.moveTo(x / 360 * 2048, 0); ctx.lineTo(x / 360 * 2048, 1024); ctx.stroke(); }
        for (var y = 0; y <= 180; y += 15) { ctx.beginPath(); ctx.moveTo(0, y / 180 * 1024); ctx.lineTo(2048, y / 180 * 1024); ctx.stroke(); }
      }
      try { globeTex[key] = cv.toDataURL("image/jpeg", 0.9); } catch (e) { globeTex[key] = url; }
      if (globe && body + "|" + LOOK === key) globe.globeImageUrl(globeTex[key]);
    };
    img.onerror = function () {
      if (globe) globe.globeImageUrl(null);
      note.textContent = "The globe's picture of " + BODIES[body].name + " did not load (culprits-tiles-more makes it); the marks are placed.";
    };
    img.src = url;
  }
  var globeTimer = null;
  function makeGlobe() {
    var g = document.getElementById("globe");
    return (typeof Globe === "undefined" ? loadScript("https://unpkg.com/globe.gl@2.46.2/dist/globe.gl.min.js") : Promise.resolve()).then(function () {
      if (globe) return;
      // The globe's sky is wrapped round a sphere far off, so it is drawn
      // larger and finer, or its stars come out as blurred blobs.
      var starUrl = starfield(8192, 4096, 9000, 1.1).toDataURL("image/jpeg", 0.9);
      globe = Globe()(g).backgroundColor("#03050A").backgroundImageUrl(starUrl).width(window.innerWidth).height(window.innerHeight)
        .showAtmosphere(true).atmosphereColor("#4E8FA6").atmosphereAltitude(0.1)
        .pointLat("lat").pointLng("lng").pointColor("color").pointRadius("r").pointAltitude(0.003).pointsMerge(false).pointLabel("label")
        .onPointClick(function (p) { info(typeof p.html === "function" ? p.html() : p.html, { lat: p.lat, lng: p.lng }); })
        .pathPoints("pts").pathPointLat(function (q) { return q[1]; }).pathPointLng(function (q) { return lon180(q[0]); }).pathColor("color").pathStroke(1.2)
        .labelLat("lat").labelLng("lng").labelText("text").labelSize("size").labelDotRadius(0).labelResolution(2)
        .labelColor(function () { return "rgba(214,220,228,0.85)"; })
        .onZoom(function () { clearTimeout(globeTimer); globeTimer = setTimeout(drawGlobe, 250); });
      window.addEventListener("resize", function () { if (globe) globe.width(window.innerWidth).height(window.innerHeight); });
    });
  }

  // ---------- switches ----------
  function setLook(k) {
    LOOK = lookOf(k)[0];
    var look = lookOf(LOOK);
    document.querySelectorAll('#setbox input[name="look"]').forEach(function (i) { i.checked = i.value === LOOK; });
    if (ground) ground.getContainer().style.filter = look[2] || "";
    if (grid) { map.removeLayer(grid); grid = null; }
    if (look[3] && !isSun()) {
      grid = L.layerGroup();
      for (var x = -180; x <= 180; x += 15) L.polyline([[-90, x], [90, x]], { renderer: canvas, color: look[3], weight: 1, interactive: false }).addTo(grid);
      for (var y = -90; y <= 90; y += 15) L.polyline([[y, -180], [y, 180]], { renderer: canvas, color: look[3], weight: 1, interactive: false }).addTo(grid);
      grid.addTo(map);
    }
    if (globe) globePicture();
    if (isSun()) drawFlat();
  }
  function viewsFor(key) {
    return BODIES[key].plane ? [["above", "From above"], ["side", "From the side"]] : [["globe", "Globe"], ["flat", "Flat map"]];
  }
  function setView(v) {
    VIEW = v;
    document.querySelectorAll('#setbox input[name="view"]').forEach(function (i) { i.checked = i.value === v; });
    var g = document.getElementById("globe");
    document.getElementById("map").style.visibility = v === "globe" ? "hidden" : "";
    g.hidden = v !== "globe";
    document.getElementById("info").hidden = true;
    if (v !== "globe") {
      if (globe) globe.pauseAnimation();
      map.invalidateSize();
      if (isSun()) fitSun(); else drawFlat();
      return;
    }
    makeGlobe().then(function () { globe.resumeAnimation(); globePicture(); drawGlobe(); })
      .catch(function () { document.getElementById("globe-note").textContent = "The globe could not be loaded here, so the flat map is shown."; setView("flat"); });
  }
  function fitSun() {
    var pts = [[0, 0]];
    onRows().forEach(function (row) {
      var r = layers[row.id].r;
      (r.marks || []).forEach(function (m) { if (inTime(m)) pts.push(where(m)); });
      (r.planets || []).forEach(function (p) { p.path.forEach(function (q) { pts.push([(VIEW === "side" ? q[2] : q[1]) * AU, q[0] * AU]); }); });
    });
    map.fitBounds(L.latLngBounds(pts).pad(0.05), { animate: false, paddingTopLeft: [innerWidth > 720 ? 330 : 10, 10], paddingBottomRight: [innerWidth > 720 ? 330 : 10, 10] });
    drawFlat();
  }
  function snapBack() {
    if (VIEW === "globe" && globe) globe.pointOfView({ lat: 0, lng: 0, altitude: 2.3 }, 800);
    else if (isSun()) fitSun();
    else map.fitBounds([[-90, -180], [90, 180]]);
  }
  function redraw() { if (VIEW === "globe") drawGlobe(); else drawFlat(); }

  // ---------- the timeline: two ends ----------
  var lo = document.getElementById("time-lo-in"), hi = document.getElementById("time-hi-in");
  function timeline() {
    var ys = [];
    onRows().forEach(function (row) { var r = layers[row.id].r; (r.marks || []).concat(r.stops || []).forEach(function (m) { if (m.year != null) ys.push(m.year); }); });
    var box = document.getElementById("time"), t = document.getElementById("time-say");
    if (!ys.length) { box.hidden = true; YLO = YHI = null; return; }
    var a = Math.min.apply(null, ys), b = Math.max.apply(null, ys);
    var whole = YLO == null || (YLO <= YMIN && YHI >= YMAX + 1);
    YMIN = a; YMAX = b;
    if (whole) { YLO = a; YHI = b + 1; }
    YLO = Math.max(a, Math.min(b + 1, YLO)); YHI = Math.max(YLO, Math.min(b + 1, YHI));
    [lo, hi].forEach(function (i) { i.min = a; i.max = b + 1; });
    lo.value = YLO; hi.value = YHI;
    var fill = document.getElementById("time-fill"), span = (b + 1 - a) || 1;
    fill.style.left = ((YLO - a) / span * 100) + "%"; fill.style.width = ((YHI - YLO) / span * 100) + "%";
    box.hidden = false;
    var to = YHI > b ? "today" : String(YHI);
    t.textContent = YLO <= a && YHI > b ? "Every year, up to today, and what is planned" : "From " + YLO + " to " + to + (YHI > b ? ", and what is planned" : "");
    document.getElementById("time-lo").textContent = a;
    document.getElementById("time-hi").textContent = "today";
  }
  lo.addEventListener("input", function () { YLO = Math.min(+lo.value, YHI); timeline(); redraw(); });
  hi.addEventListener("input", function () { YHI = Math.max(+hi.value, YLO); timeline(); redraw(); });

  function swatch(kind) {
    var m = { obj: ["--obj", "--obj-glow"], mass: ["--mass", "--mass-glow"], plan: ["--plan", "--plan-glow"], rover: ["--rover", "--rover-glow"], names: ["--bone", "--rule"],
      probe: ["--probe", "--probe-glow"], planets: ["--bone", "--rule"] }[kind];
    return "background:" + C(m[0]) + ";box-shadow:0 0 0 2px " + C(m[1]) + "66,0 0 6px " + C(m[1]);
  }
  function show(key) {
    if (!BODIES[key]) key = "moon";
    if (body === key) return;
    body = key;
    var b = BODIES[key];
    document.title = b.name + ": human impact";
    document.getElementById("body-name").textContent = key === "moon" ? "The Moon" : key === "sun" ? "The Sun" : "Mars";
    try { history.replaceState(null, "", "#" + key); } catch (e) { /* kept */ }
    layers = {}; YLO = YHI = YMIN = YMAX = null;
    document.getElementById("info").hidden = true;
    markLayer.clearLayers(); stopLayer.clearLayers(); routeLayer.clearLayers(); nameLayer.clearLayers();
    if (ground) { map.removeLayer(ground); ground = null; }
    // The map's frame: the body's ground in degrees, or the plane in AU.
    map.options.crs = b.plane ? L.CRS.Simple : L.CRS.EPSG4326;
    map.setMinZoom(b.plane ? -3 : 1); map.setMaxZoom(b.plane ? 10 : 11);
    map.setMaxBounds(b.plane ? null : [[-140, -240], [140, 240]]);
    map.attributionControl._attributions = {};
    if (!b.plane) {
      ground = L.tileLayer(b.tiles, { tileSize: 256, maxNativeZoom: b.native, maxZoom: 11, noWrap: true, bounds: [[-90, -180], [90, 180]], attribution: b.ground }).addTo(map);
      ground.bringToBack();
    } else map.attributionControl.addAttribution(b.ground);
    map.attributionControl._update();
    // The views this body has.
    document.querySelector("#setbox .views").innerHTML = viewsFor(key).map(function (v, i) {
      return '<label><input type="radio" name="view" value="' + v[0] + '"' + (i === 0 ? " checked" : "") + "> " + esc(v[1]) + "</label>";
    }).join("");
    setLook(LOOK);
    if (!b.plane) map.fitBounds([[-90, -180], [90, 180]], { animate: false });
    if (globe && !b.plane) { globePicture(); globe.pointsData([]).pathsData([]).labelsData([]); globe.pointOfView({ lat: 0, lng: 0, altitude: 2.3 }); }
    document.getElementById("body-note").textContent = b.note;
    var rows = document.getElementById("rows");
    rows.innerHTML = "<h1>" + esc(b.heading) + "</h1>";
    var unplacedAll = [], unBox = document.getElementById("unplaced-box");
    unBox.hidden = true;
    b.rows.forEach(function (row) {
      var el = document.createElement("label");
      el.className = "row";
      el.innerHTML = '<input type="checkbox"' + (picked(key, row) ? " checked" : "") + '><span class="sw" style="' + swatch(row.kind) + '"></span>' +
        '<span class="t">' + esc(row.title) + (row.live ? '<span class="live">LIVE</span>' : "") + '<span class="n">' + esc(row.sub) + "</span></span>";
      rows.appendChild(el);
      var box = el.querySelector("input"), n = el.querySelector(".n");
      var entry = layers[row.id] = { r: null, box: box }, mine = key;
      load(row).then(function (r) {
        if (body !== mine) return;
        entry.r = r;
        n.textContent = row.sub + " · " + r.count.toLocaleString() + (row.kind === "names" ? " names" : row.rover ? " stops" : row.kind === "planets" ? " planets" : " entries");
        if (r.unplaced.length) {
          r.unplaced.forEach(function (t) { unplacedAll.push(t + " (" + row.title.replace(/ \(.*\)$/, "") + ")"); });
          document.getElementById("unplaced-sum").textContent = unplacedAll.length + (unplacedAll.length === 1 ? " entry" : " entries") + " with no published place";
          document.getElementById("unplaced").innerHTML = unplacedAll.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");
          unBox.hidden = false;
        }
        timeline();
        if (b.plane && VIEW !== "globe") fitSun(); else redraw();
      }).catch(function () {
        if (body !== mine) return;
        n.textContent = row.sub + " · not built yet: culprits-tiles-more builds it on its next run";
      });
      box.addEventListener("change", function () { timeline(); redraw(); });
    });
    setView(viewsFor(key)[0][0]);
  }

  // The box of looks and views, built like the Earth map's.
  var setbox = document.getElementById("setbox");
  setbox.querySelector(".looks").innerHTML = LOOKS.map(function (l) {
    return '<label><input type="radio" name="look" value="' + l[0] + '"' + (l[0] === LOOK ? " checked" : "") + "> " + esc(l[1]) + "</label>";
  }).join("");
  setbox.addEventListener("change", function (e) {
    if (e.target.name === "look") setLook(e.target.value);
    if (e.target.name === "view") setView(e.target.value);
  });
  document.getElementById("snap").addEventListener("click", snapBack);
  if (inFrame) document.body.classList.add("in-frame");
  // The left box rolls up to its title.
  document.getElementById("roll").addEventListener("click", function () {
    var p = document.getElementById("panel"), shut = !p.classList.contains("shut");
    p.classList.toggle("shut", shut);
    this.innerHTML = shut ? "&#9662;" : "&#9652;";
    this.setAttribute("aria-expanded", String(!shut));
  });
  colourBox();

  // The map that opened this view can ask for a body and for the rows ticked there.
  window.addEventListener("message", function (e) {
    if (e.data && e.data.culpritsBody) show(e.data.culpritsBody);
    if (e.data && e.data.culpritsLayers) {
      PICK = Object.assign({ moon: {}, mars: {}, sun: {} }, e.data.culpritsLayers);
      (BODIES[body] ? BODIES[body].rows : []).forEach(function (row) { var en = layers[row.id]; if (en && en.box) en.box.checked = picked(body, row); });
      timeline(); redraw();
    }
  });
  window.addEventListener("hashchange", function () { show(location.hash.slice(1)); });
  var q = new URLSearchParams(location.search).get("body");
  show(q || location.hash.slice(1) || "moon");
})();
</script>
</body>
</html>
