<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Culprits — compilation map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
  :root{
    --peat:#17150F; --peat2:#1F1C15; --bone:#DCD6C6; --dim:#948D7C;
    --rule:#322E27; --brick:#8F4E40; --moss:#62755F; --slate:#5C6E77;
    --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    /* One width for the layer panel, the news wires box, and the legend and
       zoom buttons side by side. */
    --box-w:290px; --left-w:var(--box-w); --zoom-w:29px; --box-gap:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--peat);color:var(--bone);font-family:var(--sans)}
  #map{position:absolute;inset:0}
  .stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;background:#06080D}
  .space{position:fixed;inset:0;width:100%;height:100%;border:0;pointer-events:none;
         background:#000;opacity:0;transition:opacity .9s ease}
  .space[hidden]{display:none}
  .space.on{opacity:1;pointer-events:auto}
  #map{transition:opacity .9s ease}
  #map.away{opacity:0;pointer-events:none}
  .left-col.away,.panel.away,#legend.away,.wire.away{opacity:0;pointer-events:none;transition:opacity .5s ease}
  /* Beside Eyes' own search button, top right. */
  .reload-wrap{display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:11.5px;color:var(--dim)}
  .reload-early{position:absolute;top:16px;right:9px;z-index:4;background:rgba(31,28,21,.94);border:1px solid var(--rule)}
  /* Its own row under the settings box: it keeps its height whatever the
     box above does, and the box above scrolls within what is left. */
  .right-col > .reload-wrap{flex:0 0 auto;margin-top:6px;padding:5px 9px;overflow:visible}
  .right-col > #basemaps{flex:0 1 auto;min-height:0}
  /* A row's tools and chips stay put away while it is unticked. */
  .facet[hidden]{display:none}
  #reload-map{width:26px;height:26px;border-radius:4px;border:0;cursor:pointer;flex:none;
    background:#fff;color:#333;font:16px/26px system-ui,sans-serif;box-shadow:0 0 0 2px rgba(0,0,0,.1)}
  .reload-cap{line-height:1.2;max-width:none;flex:1;min-width:0}
  /* Layer rows in the layers box, laid out like Global Safety Net's own list:
     a small square of the layer's colour, the name, little space between. A
     row's line of detail (its count, or why it is empty) shows once it is ticked. */
  #layers .layer{gap:6px;padding:0;border-top:none;font-size:12px;line-height:1.25;align-items:center}
  #layers .layer input{margin:0}
  #layers .swatch{width:10px;height:10px;border-radius:2px;margin:0}
  #layers .layer .un{display:none;font-size:11px;line-height:1.3}
  /* The source's own site, beside the title. A link inside a label is not
     passed on to the tick, so opening it does not turn the layer on. */
  #layers .nm .src{margin-left:5px;color:var(--dim);text-decoration:none;font-size:10.5px;opacity:.7}
  #layers .nm .info{display:inline-block;margin-left:5px;width:12px;height:12px;line-height:12px;border-radius:50%;
    border:1px solid var(--dim);color:var(--dim);font:italic 600 9px/12px Georgia,serif;text-align:center;opacity:.75;cursor:help;vertical-align:1px}
  #layers .nm .info:hover,#layers .nm .info:focus{opacity:1;color:var(--bone);border-color:var(--bone);outline:none}
  #row-tip{position:fixed;z-index:60;background:var(--peat,#17150F);color:var(--bone,#DCD6C6);border:1px solid var(--rule,#322E27);
    border-radius:4px;padding:8px 10px;font-size:12px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.45);pointer-events:none;max-height:50vh;overflow:hidden}
  #row-tip[hidden]{display:none}
  #layers .facet.wms-legend{padding:4px 8px 6px 30px;max-height:180px;overflow:auto}
  #layers .facet.wms-legend img{max-width:100%;display:block}
  #layers .nm .src:hover{color:var(--bone);opacity:1}
  #layers .layer:has(> input:checked){align-items:flex-start}
  #layers .layer:has(> input:checked){padding:2px 0}
  #layers .layer:has(> input:checked) > input,#layers .layer:has(> input:checked) > .swatch{margin-top:2px}
  #layers .layer:has(> input:checked) .un{display:block}
  #layers .layer.parent .un{display:block}
  #layers .facet{padding:1px 0 5px 22px}
  /* A row's own filters: the filter's name on its own line, its chips under
     it, and a long list held to a few rows that scroll rather than pushing
     the rest of the box off the screen. */
  #layers .facet-set{display:block}
  #layers .facet-set .fl{display:flex;align-items:center;gap:6px;margin:3px 0 2px;
    color:var(--dim);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
  #layers .facet-set .fl .chip{text-transform:none;letter-spacing:0;padding:0 5px}
  #layers .facet-set .fl select{margin-left:auto}
  #layers .facet-set .fv{display:flex;flex-wrap:wrap;gap:4px;max-height:96px;overflow:auto;padding-right:3px}
  #layers .facet-set .chip em{font-style:normal;opacity:.6;font-size:10.5px}
  #layers .facet-set .sm-legend{margin-top:5px}
  #layers .kids{margin:0 0 1px 9px}
  #layers .group{margin:0}
  /* The Satellite basemap's planetary-defence frame (see DEFENCE in app.js).
     Fine corner brackets and a faint vignette; none of it takes clicks or
     covers the middle of the map. The scan line that used to sweep down the
     screen is gone: a bar crossing the map every eleven seconds is an arcade
     screen, not an instrument, and it drew attention away from the map it was
     supposed to be framing. */
  #defence-hud{position:absolute;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 68%, rgba(4,16,22,.30) 100%)}
  #defence-hud[hidden]{display:none}
  #defence-hud .br{position:absolute;width:56px;height:56px;border:1px solid rgba(63,167,163,.28)}
  #defence-hud .tl{top:10px;left:calc(var(--left-w) + 32px);border-right:0;border-bottom:0}
  #defence-hud .tr{top:10px;right:calc(var(--box-w) + 24px);border-left:0;border-bottom:0}
  #defence-hud .bl{bottom:34px;left:calc(var(--left-w) + 32px);border-right:0;border-top:0}
  #defence-hud .bre{bottom:34px;right:calc(var(--box-w) + 24px);border-left:0;border-top:0}
  .defence-ping{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
    border:1px solid rgba(63,167,163,.55);pointer-events:none;z-index:2;animation:defence-ping .7s ease-out forwards}
  @keyframes defence-ping{to{transform:scale(3.4);opacity:0}}
  @media (prefers-reduced-motion: reduce){.defence-ping{animation:none;display:none}}
  /* The layers box rolls up whole: the box shrinks to its heading. */
  .left-col .panel.shut{flex:0 0 auto;height:auto !important}
  /* A page panel sets display:flex, which would otherwise override hidden. */
  .companion[hidden]{display:none !important}
  .space-back{position:fixed;right:14px;top:14px;z-index:60;font:inherit;font-size:14px;
    color:var(--bone);background:rgba(11,16,23,.86);border:1px solid var(--rule);border-radius:4px;
    padding:11px 16px;cursor:pointer}
  .space-back:hover{border-color:var(--bone)}
  .space-back[hidden]{display:none}
  .space-earth{position:fixed;left:50%;top:50%;z-index:60;transform:translate(-50%,-50%);
    border:1px solid transparent;border-radius:50%;background:none;color:var(--bone);
    font:inherit;font-size:12.5px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
  .space-earth[hidden]{display:none}
  .space-earth span{opacity:0;padding:4px 8px;background:rgba(11,16,23,.7);border-radius:3px}
  .space-earth:hover{border-color:rgba(220,214,198,.45)}
  .space-earth:hover span{opacity:1}
  .space-edge{position:fixed;inset:0;z-index:59;pointer-events:none}
  .space-edge[hidden]{display:none}
  .space-edge .se{position:absolute;pointer-events:auto}
  .space-edge .t{left:0;right:0;top:0;height:46px}
  .space-edge .b{left:0;right:0;bottom:0;height:34px}
  .space-edge .l{top:0;bottom:0;left:0;width:34px}
  .space-edge .r{top:0;bottom:0;right:0;width:34px}
  .leave-row{display:block}
  .leave-row .leave{display:inline-block;margin:2px 0 4px;font:inherit;color:var(--bone);background:none;
                    border:1px solid var(--rule);border-radius:3px;padding:4px 10px;cursor:pointer}
  .leave-row .leave:hover{border-color:var(--bone)}
  .leave-row .un{display:block}
  .fit-box{position:fixed;left:12px;bottom:12px;z-index:61;max-width:340px;padding:10px 12px;
           background:rgba(11,16,23,.9);border:1px solid var(--rule);color:var(--bone);font-size:12px}
  .fit-box code{display:block;margin-top:6px;color:var(--dim);word-break:break-all}

  /* Three boxes down the left: the name, the settings, the layers. */
  /* The right edge of the layers column is a handle: drag it out for long
     layer names, drag it back for more map. Double-click puts it back. */
  .col-edge{position:absolute;top:0;right:-7px;width:12px;bottom:0;cursor:ew-resize;
    z-index:6;touch-action:none;pointer-events:auto}
  .col-edge::before{content:"";position:absolute;top:50%;right:5px;width:2px;height:34px;
    margin-top:-17px;border-radius:2px;background:var(--rule)}
  .col-edge:hover::before{background:var(--dim)}
  .left-col{position:absolute;top:16px;left:16px;width:var(--left-w);bottom:calc(16px + var(--legend-h,0px));
    display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .left-col .panel{flex:1 1 auto}
  /* The view and basemap box, top right; the news wires box sits under it. */
  .right-col{position:absolute;top:16px;right:9px;width:var(--box-w);z-index:3;max-height:48vh;
    display:flex;flex-direction:column;pointer-events:none}
  .right-col > *{pointer-events:auto;background:rgba(31,28,21,.94);border:1px solid var(--rule);
    font-size:13.5px;line-height:1.5;backdrop-filter:blur(6px);overflow:auto}
  .right-col.away{opacity:0;pointer-events:none;transition:opacity .5s ease}
  /* The layers box as a table of contents. */
  .toc-head{display:flex;align-items:baseline;gap:6px;width:100%;background:none;border:0;cursor:pointer;
    font:inherit;text-align:left;padding:3px 0}
  .toc-head:hover{color:#fff}
  .toc-arrow{display:inline-block;width:10px;color:var(--dim);transition:transform .12s}
  .toc-head[aria-expanded="true"] .toc-arrow{transform:rotate(90deg)}
  .toc-n{margin-left:auto;color:var(--dim);font-size:10.5px;font-weight:400;letter-spacing:0;text-transform:none}
  .toc-body{padding-left:6px}
  .toc-body[hidden]{display:none}
  .toc-note{color:var(--dim);font-size:11px;font-style:italic;margin:2px 0 6px 16px}
  .left-col > *{pointer-events:auto;background:rgba(31,28,21,.94);border:1px solid var(--rule);
    font-size:13.5px;line-height:1.5;backdrop-filter:blur(6px)}
  .title-box{display:flex;align-items:center;gap:8px;padding:9px 12px 10px}
  .ctrl-box{padding:9px 12px 10px}
  .panel{min-height:0;overflow:auto;padding:10px 13px 0;display:flex;flex-direction:column}
  .title-box h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em;flex:1}
  .p-roll{background:none;border:0;color:var(--dim);font-size:13px;line-height:1;cursor:pointer;padding:2px 4px}
  .p-roll:hover{color:var(--bone)}
  .panel-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;
    background:rgba(31,28,21,.94);padding:1px 0 5px;color:var(--dim);font-size:11px;
    letter-spacing:.06em;text-transform:uppercase}
  .panel.shut{height:auto;max-height:none;overflow:hidden}
  .panel.shut > *{display:none}
  .panel.shut > .panel-head{display:flex}
  .all-btns{display:flex;gap:4px;margin-left:auto;margin-right:6px;text-transform:none;letter-spacing:0}
  /* Story titles in a news mark's box: plain light text, not link purple. */
  .wire-pop a{color:#F2EEE6;text-decoration:none}
  .wire-pop-list{max-height:260px;overflow:auto;padding-right:4px}
  .wire-pop-sort{display:flex;align-items:center;gap:6px;margin:3px 0 2px;font-size:11.5px;color:var(--dim)}
  /* Six rows of menus would push the list out of the box, so they scroll
     together and the stories keep their own room underneath. */
  .wire-pop-sort > :first-child{flex:0 0 62px}
  .wire-pop-filters{max-height:150px;overflow:auto;padding-right:4px}
  .wire-pop-sort select{flex:1;font:inherit;color:var(--bone);background:var(--peat,#17150F);
    border:1px solid var(--rule);border-radius:2px;padding:1px 4px}
  .wire-pop a:hover{text-decoration:underline;text-decoration-color:var(--dim)}

  /* The settings box: names only, close together. */
  .ctrl-box .layer{padding:3px 0;gap:7px;border-top:none}
  .ctrl-box .bm-h{margin:6px 0 2px}
  .ctrl-box .bm-h:first-child{margin-top:0}
  .sect-head{display:flex;align-items:center;justify-content:space-between}
  .sect-head .bm-h{margin:0}
  .sect + .sect{margin-top:7px;padding-top:6px;border-top:1px solid var(--rule)}
  .sect.shut .sect-body{display:none}
  /* How to tilt: small notes to the right of the terrain tick box. */
  .terrain-row{display:flex;gap:8px;align-items:flex-start;margin-top:4px}
  .terrain-row > .layer{flex:0 0 auto}
  .how-boxes{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .how{margin:0;padding:3px 6px;border:1px solid var(--rule);border-radius:2px;
    color:var(--dim);font-size:10.5px;line-height:1.35}
  .how b{color:var(--bone);font-weight:600;margin-right:3px}
  .view-row{display:flex;align-items:stretch;gap:9px}
  .view-choices{flex:1;min-width:0}
  .ctrl-box .leave{flex:1 1 55%;align-self:stretch;font:inherit;font-size:17px;font-weight:600;line-height:1.2;
    color:var(--bone);background:rgba(92,110,119,.18);border:1px solid var(--slate);border-radius:3px;
    padding:10px 14px;cursor:pointer;text-align:center}
  .ctrl-box .leave:hover{border-color:var(--bone)}

  .layer{display:flex;gap:9px;align-items:flex-start;padding:7px 0;
    border-top:1px solid var(--rule);cursor:pointer}
  .layer:first-of-type{border-top:none}
  .layer input{margin:3px 0 0;accent-color:var(--moss);flex:none}
  .layer .body{min-width:0}
  .layer .nm{display:block}
  .layer .un{color:var(--dim);font-size:12px}
  .swatch{width:10px;height:10px;border-radius:50%;flex:none;margin:4px 0 0}
  .bm-h{margin:0 0 2px;color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .pending-note{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--rule);
    color:var(--dim);font-size:12px;line-height:1.45}

  .kinds{padding:0 0 6px;border-bottom:1px solid var(--rule);margin-bottom:6px}
  .kinds .facet{padding:0 0 6px}
  .kinds .bm-h{margin:4px 0 3px}
  .facet{display:flex;flex-wrap:wrap;gap:4px;padding:0 0 9px 27px}
  .chip{font:inherit;font-size:11.5px;line-height:1.5;background:none;color:var(--dim);
    border:1px solid var(--rule);padding:1px 6px;cursor:pointer;border-radius:2px}
  .chip:hover{color:var(--bone);border-color:var(--dim)}
  .chip.on{color:var(--peat);background:var(--bone);border-color:var(--bone)}
  .chip.reset{font-style:italic}

  .note{margin-top:15px;padding-top:13px;border-top:1px solid var(--rule);
    color:var(--dim);font-size:12px}

  /* Guerillamap companion. A sibling element of #map, not a MapLibre layer or
     control — so the basemap grading and the data layers are untouched by it,
     and opening it only changes the map container's height. */
  /* Nested group. Indented and hairlined so the children read as belonging to
     the parent rather than as six more top-level layers. */
  .group{margin:2px 0}
  .layer.parent{display:flex;align-items:flex-start;gap:7px}
  .disc{background:none;border:0;color:var(--dim);cursor:pointer;padding:0 1px;
    font-size:11px;line-height:1.5;flex:0 0 auto}
  .disc:hover{color:var(--bone)}
  .kids{border-left:1px solid var(--rule);margin:1px 0 3px 9px}
  .kids[hidden]{display:none}
  .layer.child{padding-left:13px}
  /* A child row's title is a layer's title like any other, so it reads in the
     same ink. The indent and the rule down the left already say it sits inside
     a group; dimming it as well said, wrongly, that it mattered less. */
  .layer.child .nm{color:inherit}

  /* Guerillamap opens like every other outside page: a panel along the bottom,
     over the map, with a strip and bar to drag it taller or shorter. */
  .gm{position:fixed;right:0;bottom:0;left:0;height:46vh;z-index:40;background:var(--peat,#17150F);
      border-top:1px solid var(--rule,#322E27);display:flex;flex-direction:column}
  .gm[hidden]{display:none}
  .gm-grab{height:9px;cursor:ns-resize;touch-action:none;display:flex;justify-content:center;align-items:center}
  .gm-grab span{width:44px;height:3px;border-radius:2px;background:var(--rule,#322E27)}
  .gm-bar{display:flex;align-items:center;gap:11px;padding:2px 12px 6px;font-size:12.5px;color:var(--dim);cursor:ns-resize;touch-action:none}
  .gm-bar .nm{color:var(--bone)}
  .gm-bar label{display:flex;align-items:center;gap:5px;cursor:pointer}
  .gm-bar input{accent-color:var(--moss)}
  .gm-bar a{color:var(--slate,#8A9DA6)}
  .gm-bar .sp{margin-left:auto}
  .gm-bar button{font:inherit;background:none;color:var(--dim);border:1px solid var(--rule);border-radius:2px;padding:1px 7px;cursor:pointer}
  .gm-bar button:hover{color:var(--bone);border-color:var(--dim)}
  .gm-frame{flex:1;width:100%;border:0}
  .gm-wait{margin:0;padding:7px 12px;font-size:12px;color:var(--dim)}

  /* Legend. Bottom right, above the attribution, narrow enough not to cover
     the map. Lists only what is switched on. */
  #legend{position:absolute;left:16px;bottom:16px;z-index:2;width:var(--left-w);max-width:none;
    background:rgba(17,21,15,.88);border:1px solid var(--rule);border-radius:2px;
    padding:6px 8px;font-size:11px;line-height:1.35;color:var(--dim);
    max-height:42vh;overflow-y:auto}
  #legend[hidden]{display:none}
  /* Zoom in, zoom out, the compass and the whole-world button: two by two,
     in the view row between the view choices and Leave Earth. */
  .view-zoom{flex:0 0 auto;align-self:center}
  .view-row .view-choices{flex:0 0 auto}
  /* Snap back over Leave Earth, to the right of the zoom buttons. */
  .view-go{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
  .view-go .snap{font:inherit;font-size:11.5px;line-height:1.2;color:var(--bone);background:none;
    border:1px solid var(--rule);border-radius:3px;padding:4px 6px;cursor:pointer}
  .view-go .snap:hover{border-color:var(--bone)}
  .view-go .leave{flex:1 1 auto!important;min-width:0;font-size:15px!important;padding:6px 8px!important}
  .terrain-left{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
  .compass-holder{display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:14px}
  .compass-cap{font-size:10px;line-height:1.2;color:var(--dim);text-align:center;max-width:84px}
  .compass-holder .maplibregl-ctrl-group{margin:0;border-radius:3px;box-shadow:none;
    border:1px solid var(--rule);background:rgba(23,21,15,.6);display:inline-block}
  .compass-holder button{width:30px;height:30px;background-color:transparent}
  .compass-holder .maplibregl-ctrl-icon{filter:invert(1) brightness(.86)}
  .view-zoom .maplibregl-ctrl-group{position:static;margin:0;display:grid;grid-template-columns:26px;
    border-radius:3px;box-shadow:none;border:1px solid var(--rule);background:rgba(23,21,15,.6);overflow:hidden}
  .view-zoom .maplibregl-ctrl-group button{width:26px;height:26px;background-color:transparent;
    border:0;border-top:0!important}
  .view-zoom .maplibregl-ctrl-group button + button{border-top:1px solid var(--rule)!important}
  .view-zoom .maplibregl-ctrl-icon{filter:invert(1) brightness(.86)}
  .view-zoom .to-world{display:flex;align-items:center;justify-content:center;color:#DBD6CA;cursor:pointer}
  .view-zoom .to-world:hover{color:var(--bone)}
  .to-globe{font:inherit;font-size:12.5px;color:var(--bone);background:none;border:1px solid var(--rule);
    border-radius:3px;padding:4px 8px;cursor:pointer;white-space:nowrap}
  .to-globe:hover{border-color:var(--bone)}

  /* The grip each box is pulled by. */
  /* The handle that pulls a box open or shut. It was a hairline nobody
     found: now a bar with a lip above and below it, brighter on hover. */
  .pull-grip{flex:none;height:16px;cursor:ns-resize;position:relative;touch-action:none}
  .pull-grip::before{content:"";position:absolute;left:50%;top:50%;width:46px;height:4px;margin:-2px 0 0 -23px;
    border-radius:2px;background:var(--dim);opacity:.7}
  .pull-grip::after{content:"";position:absolute;left:50%;top:50%;width:70px;height:12px;margin:-6px 0 0 -35px;
    border-radius:3px;border:1px solid var(--rule)}
  .pull-grip:hover::before{background:var(--bone);opacity:1}
  .pull-grip:hover::after{border-color:var(--dim)}
  /* Pulled right down, a box stops scrolling what it is hiding, so no
     scrollbar is left standing down the side of an empty box. */
  .pulled-shut{overflow:hidden !important}
  /* Live rows say so, beside the title. */
  #layers .nm .live{margin-left:5px;padding:0 3px;border:1px solid var(--rule);border-radius:2px;
    color:var(--dim);font-size:8.5px;letter-spacing:.08em;vertical-align:1px}
  .panel,#legend{overflow:auto}
  /* The grip stays on the box's edge while its contents scroll under it. */
  .panel .pull-grip{position:sticky;bottom:0;margin-top:8px;background:rgba(31,28,21,.94)}
  #legend .pull-grip{position:sticky;top:0;background:rgba(17,21,15,.88)}
  .lg-hd{color:var(--bone);font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;margin-bottom:4px}
  .lg-row{display:flex;align-items:baseline;gap:6px;margin:2px 0}
  .lg-on{flex:0 0 auto;width:11px;height:11px;margin:0;accent-color:#8A9DA6;cursor:pointer}
  .lg-sw{flex:0 0 auto;width:8px;height:8px;border-radius:50%;margin-top:3px}
  .lg-hollow{background:none;border:1px solid var(--dim)}
  .lg-nm{color:var(--bone);flex:0 0 auto}
  .lg-un{color:var(--dim);font-size:10px}
  .lg-rule{border-top:1px solid var(--rule);margin:5px 0 3px}

  .maplibregl-popup-content{background:var(--peat2);color:var(--bone);
    border:1px solid var(--rule);border-radius:2px;font-size:13px;padding:11px 13px;max-width:260px}
  /* Not inside a site map's own box (.wtyg-box): those carry their map's styling. */
  .maplibregl-popup:not(.wtyg-box) .maplibregl-popup-content b{display:block;margin-bottom:3px}
  .maplibregl-popup:not(.wtyg-box) .maplibregl-popup-content .meta{color:var(--dim);font-size:12px;margin-top:5px}
  .maplibregl-popup-tip{border-top-color:var(--peat2)!important;border-bottom-color:var(--peat2)!important}
  .maplibregl-popup-close-button{color:var(--dim);font-size:17px}
</style>
</head>
<body>
<!-- The sky the map sits in: drawn in app.js, behind everything. -->
<canvas id="stars" class="stars" aria-hidden="true"></canvas>
<!-- NASA's Eyes on the Solar System. Loaded as the map nears the hand-over
     point, and given the whole screen, and every click, once it is crossed. -->
<iframe id="space" class="space" title="NASA's Eyes on the Solar System"
        referrerpolicy="no-referrer" hidden></iframe>
<!-- The screen's own edge while Eyes has the middle: scroll in here, or
     double-click, to come back to the map. -->
<div class="space-edge" id="spaceEdge" hidden aria-hidden="true">
  <div class="se t"></div><div class="se b"></div><div class="se l"></div><div class="se r"></div>
</div>
<button class="space-back" id="spaceBack" hidden>&#8592; Back to the map</button>
<div id="map"></div>

<!-- The reload button is plain page markup with its own handler, so it is
     there and clickable from the first moment, before the map has loaded and
     even if the map's script is slow or has failed. Once the view box exists
     it is moved beside the zoom buttons. -->
<div id="defence-hud" hidden><i class="br tl"></i><i class="br tr"></i><i class="br bl"></i><i class="br bre"></i></div>
<div class="reload-wrap reload-early" id="reload-wrap">
  <button type="button" id="reload-map" aria-label="Reload the map"
          onclick="try{var v=window.__culpritsView;if(v)sessionStorage.setItem('culprits-view',v)}catch(e){}location.reload()">&#8635;</button>
  <span class="reload-cap">Stuck? Reload here, or press ⌘R (Ctrl-R)</span>
</div>
<div class="right-col">
  <div id="basemaps" class="ctrl-box"></div>
</div>

<div class="left-col">
  <div class="panel">
    <div class="panel-head">
      <span>Layers</span>
      <span class="all-btns"><button type="button" class="chip" id="layersAllOn" title="Tick every layer">All on</button><button type="button" class="chip" id="layersAllOff" title="Untick every layer">All off</button></span>
      <button class="p-roll" id="panelRoll" title="Roll the layer list up or down" aria-expanded="true">&#9662;</button>
    </div>
    <div id="layers"></div>
    <p class="note" id="note"></p>
  </div>
</div>

<div id="legend" hidden></div>

<div class="gm" id="gm" hidden>
  <div class="gm-grab" title="Drag up or down to resize"><span></span></div>
  <div class="gm-bar">
    <span class="nm">Guerillamap overlays</span>
    <label><input type="checkbox" id="gmFollow" checked> follow this map</label>
    <a id="gmOut" href="https://guerillamap.com/" target="_blank" rel="noopener">open &#8599;</a>
    <span class="sp"></span>
    <button id="gmClose">close</button>
  </div>
  <p class="gm-wait" id="gmWait">Loading guerillamap&#8230;</p>
  <iframe class="gm-frame" id="gmFrame"
          title="Guerillamap fossil fuel, nuclear and active fire overlays"
          referrerpolicy="no-referrer" loading="lazy"></iframe>
</div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<script src="./app.js"></script>
<script src="./wire.js"></script>
</body>
</html>
