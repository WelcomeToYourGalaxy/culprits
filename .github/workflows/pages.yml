name: Deploy map to Pages

# GitHub Pages branch deployment only offers "/" or "/docs" as a source folder,
# so it cannot serve map/ directly. Deploying via Actions instead lets any
# directory be the site root, which keeps the repo laid out by what things are
# rather than by what Pages happens to accept.
#
# Set Settings -> Pages -> Source to "GitHub Actions" for this to take effect.
#
# Runs on pushes that touch the map, and after refresh.yml finishes.
#
# The workflow_run trigger is not redundant: a push made with the default
# GITHUB_TOKEN does not start another workflow — GitHub blocks that to prevent
# loops. So refresh.yml committing new tiles would NOT trigger the push event
# below, and fresh tiles would sit in the repo undeployed until something else
# touched map/. This trigger closes that gap.
on:
  push:
    branches: [main]
    paths:
      - "map/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Refresh atlas tiles"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it; queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Fail loudly if the map would deploy without its data. A missing archive
      # is a blank layer at runtime with nothing explaining why.
      - name: Check the map has what it fetches
        run: |
          test -f map/index.html || { echo "::error::map/index.html missing"; exit 1; }
          test -f map/app.js     || { echo "::error::map/app.js missing"; exit 1; }
          test -f map/data/boundaries.geojson || {
            echo "::error::map/data/boundaries.geojson missing — country layers will not draw"
            exit 1; }

          # A layer marked ready with no archive is a silent blank layer at
          # runtime, so name it here instead.
          missing=0
          for id in $(grep -oP 'id:"\K[a-z_]+(?=".*route:"pmtiles".*ready:true)' map/app.js); do
            if [ ! -f "map/tiles/$id.pmtiles" ]; then
              echo "::warning::$id is ready:true but map/tiles/$id.pmtiles is missing — run the Refresh workflow"
              missing=1
            fi
          done
          [ "$missing" = 0 ] && echo "all ready pmtiles layers have archives"
          echo "tiles present:"; ls -la map/tiles/ 2>/dev/null || echo "  none yet"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: map
      - id: deployment
        uses: actions/deploy-pages@v4
