<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Culprits — compilation map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root{
    --peat:#17150F; --peat2:#1F1C15; --bone:#DCD6C6; --dim:#948D7C;
    --rule:#322E27; --brick:#8F4E40; --moss:#62755F; --slate:#5C6E77;
    --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--peat);color:var(--bone);font-family:var(--sans)}
  #map{position:absolute;inset:0}

  .panel{
    position:absolute;top:16px;left:16px;width:290px;max-height:calc(100% - 32px);
    overflow:auto;background:rgba(31,28,21,.94);border:1px solid var(--rule);
    padding:16px 17px;font-size:13.5px;line-height:1.5;backdrop-filter:blur(6px);
  }
  .panel h1{font-size:17px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
  .panel .zoomstate{color:var(--dim);font-size:12.5px;margin:0 0 15px}
  .panel .zoomstate b{color:var(--bone);font-weight:500}

  .layer{display:flex;gap:9px;align-items:flex-start;padding:7px 0;
    border-top:1px solid var(--rule);cursor:pointer}
  .layer:first-of-type{border-top:none}
  .layer input{margin:3px 0 0;accent-color:var(--moss);flex:none}
  .layer .body{min-width:0}
  .layer .nm{display:block}
  .layer .un{color:var(--dim);font-size:12px}
  .swatch{width:10px;height:10px;border-radius:50%;flex:none;margin:4px 0 0}
  .pending{opacity:.45}
  .pending .un::after{content:" · not yet harvested"}

  .facet{display:flex;flex-wrap:wrap;gap:4px;padding:0 0 9px 27px}
  .chip{font:inherit;font-size:11.5px;line-height:1.5;background:none;color:var(--dim);
    border:1px solid var(--rule);padding:1px 6px;cursor:pointer;border-radius:2px}
  .chip:hover{color:var(--bone);border-color:var(--dim)}
  .chip.on{color:var(--peat);background:var(--bone);border-color:var(--bone)}
  .chip.reset{font-style:italic}

  .note{margin-top:15px;padding-top:13px;border-top:1px solid var(--rule);
    color:var(--dim);font-size:12px}

  .maplibregl-popup-content{background:var(--peat2);color:var(--bone);
    border:1px solid var(--rule);border-radius:2px;font-size:13px;padding:11px 13px;max-width:260px}
  .maplibregl-popup-content b{display:block;margin-bottom:3px}
  .maplibregl-popup-content .meta{color:var(--dim);font-size:12px;margin-top:5px}
  .maplibregl-popup-tip{border-top-color:var(--peat2)!important;border-bottom-color:var(--peat2)!important}
  .maplibregl-popup-close-button{color:var(--dim);font-size:17px}
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <h1>The Culprits</h1>
  <p class="zoomstate" id="zoomstate">Reading the aggregate view.</p>
  <div id="layers"></div>
  <p class="note" id="note"></p>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<script src="./app.js"></script>
</body>
</html>
