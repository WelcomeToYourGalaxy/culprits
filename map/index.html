<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Culprits — compilation map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<!-- HOLOGRAM VIEW (1 of 2): colours, font and overlays. The code is in the
     script block with id "holo-script" at the bottom of this file. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="holo-style">
  :root{
    /* Change the hologram's colours here, and only here. */
    --holo-bg:     #0a1230;                  /* screen background (lighter at centre) */
    --holo-earth:  #111d45;                  /* the planet's face, a shade lighter than space */
    --holo-line:   #7fb8d9;                  /* country outlines and the planet's rim */
    --holo-glow:   #5b9cc8;                  /* soft glow under lines and markers */
    --holo-grid:   rgba(127,184,217,0.15);   /* 15° grid lines and the floor grid */
    --holo-detail: #6d9fc0;                  /* close-in OpenStreetMap lines and buildings */
    --holo-fringe: #8e86c8;                  /* 80s colour fringe beside the outlines */
    --holo-font: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  /* The screen behind the map. The map canvas is see-through where nothing is
     drawn, so hiding the basemap lets this show. */
  body.holo-on #map{
    background:var(--holo-bg);
    background:radial-gradient(ellipse at 50% 45%,
      color-mix(in srgb, var(--holo-bg), #ffffff 9%) 0%, var(--holo-bg) 70%);
  }
  /* Stars on: the map goes see-through and the page's own star field (drawn
     by app.js on #stars) shows behind it, over the same navy screen. */
  body.holo-on.holo-stars-on #map{background:transparent}
  body.holo-on.holo-stars-on #stars{
    background:radial-gradient(ellipse at 50% 45%,
      color-mix(in srgb, var(--holo-bg), #ffffff 6%) 0%, var(--holo-bg) 55%,
      color-mix(in srgb, var(--holo-bg), #000000 35%) 100%)}
  /* Overlays sit just above the map drawing, under popups and every panel,
     and never take a click or a drag. */
  .holo-scan,.holo-floor,.holo-rim,.holo-crt{position:absolute;pointer-events:none;display:none}
  body.holo-on .holo-scan,body.holo-on .holo-rim{display:block}
  body.holo-on.holo-floor-on .holo-floor{display:block}
  body.holo-on.holo-fx-on .holo-crt{display:block}
  .holo-rim{left:0;top:0;width:100%;height:100%}
  .holo-scan{inset:0;opacity:.04;
    background:repeating-linear-gradient(to bottom, var(--holo-line) 0 1px, transparent 1px 3px)}
  .holo-floor{left:0;right:0;bottom:0;height:26vh;perspective:320px;perspective-origin:50% 0;overflow:hidden;
    -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 100%);
            mask-image:linear-gradient(to top,#000 0%,transparent 100%)}
  .holo-floor i{position:absolute;left:-50%;right:-50%;top:0;height:200%;transform-origin:50% 0;
    transform:rotateX(62deg);
    background-image:linear-gradient(var(--holo-grid) 1px, transparent 1px),
                     linear-gradient(90deg, var(--holo-grid) 1px, transparent 1px);
    background-size:44px 44px}
  /* 80s effects: a tube's darker, rounded edges (the colour fringe on the
     outlines is a map layer, in the script below). */
  .holo-crt{inset:0;border-radius:18px;
    background:radial-gradient(ellipse at center, transparent 58%, rgba(2,4,14,.38) 100%);
    box-shadow:inset 0 0 70px rgba(2,4,14,.55)}
  /* The switch in the Basemap box. */
  .holo-ctl{margin-top:5px;padding-top:5px;border-top:1px solid var(--rule)}
  .holo-ctl .nm{font-family:var(--holo-font);font-size:12.5px;letter-spacing:.02em}
  /* Hologram view and Basemap underneath side by side, the fold button last. */
  .holo-ctl .holo-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .holo-ctl .holo-row .holo-fold{padding:0 1px}
  .holo-ctl .holo-row .layer{margin:0;white-space:nowrap;flex:none}
  .holo-ctl .holo-row .nm{font-size:11.5px;letter-spacing:0}
  .holo-ctl .holo-row .layer + .layer .nm{font-size:10.5px}
  .holo-ctl .holo-sub{padding-left:20px}
  .holo-ctl .holo-fold{margin-left:auto;background:none;border:0;color:var(--dim);cursor:pointer;
    font-size:11px;line-height:1.5;padding:0 3px}
  .holo-ctl .holo-fold:hover{color:var(--bone)}
  .holo-ctl .holo-fold[hidden]{display:none}
  .holo-ctl .holo-sub[hidden]{display:none}
  .holo-ctl .holo-sub .nm{font-size:11.5px;color:var(--dim)}
  .holo-ctl .holo-tint{display:flex;align-items:center;gap:6px;padding:0 0 4px 20px;
    font:11px var(--holo-font);color:var(--dim)}
  .holo-ctl .holo-tint[hidden]{display:none}
  .holo-ctl .holo-tint input{flex:1;min-width:0;accent-color:var(--slate)}
  .holo-ctl .holo-note{margin:1px 0 2px 20px;font:11px/1.35 var(--holo-font);color:var(--dim)}
  .holo-ctl .holo-note:empty{display:none}
</style>
<style>
  :root{
    --peat:#17150F; --peat2:#1F1C15; --bone:#DCD6C6; --dim:#948D7C;
    --rule:#322E27; --brick:#8F4E40; --moss:#62755F; --slate:#5C6E77;
    --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    /* One width for the layer panel, the news wires box, and the legend and
       zoom buttons side by side. */
    --box-w:290px; --left-w:var(--box-w); --zoom-w:29px; --box-gap:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--peat);color:var(--bone);font-family:var(--sans)}
  #map{position:absolute;inset:0}
  .stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;background:#06080D}
  .space{position:fixed;inset:0;width:100%;height:100%;border:0;pointer-events:none;
         background:#000;opacity:0;transition:opacity .9s ease}
  .space[hidden]{display:none}
  .space.on{opacity:1;pointer-events:auto}
  #map{transition:opacity .9s ease}
  #map.away{opacity:0;pointer-events:none}
  .left-col.away,.panel.away,#legend.away,.wire.away{opacity:0;pointer-events:none;transition:opacity .5s ease}
  /* Beside Eyes' own search button, top right. */
  .reload-wrap{display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:11.5px;color:var(--dim)}
  .reload-early{position:absolute;top:16px;right:9px;z-index:4;background:rgba(31,28,21,.94);border:1px solid var(--rule)}
  /* Its own row under the settings box: it keeps its height whatever the
     box above does, and the box above scrolls within what is left. */
  .right-col > .reload-wrap{flex:0 0 auto;margin-top:6px;padding:5px 9px;overflow:visible}
  .right-col > #basemaps{flex:0 1 auto;min-height:0}
  /* A row's tools and chips stay put away while it is unticked. */
  .facet[hidden]{display:none}
  #reload-map{width:26px;height:26px;border-radius:4px;border:0;cursor:pointer;flex:none;
    background:#fff;color:#333;font:16px/26px system-ui,sans-serif;box-shadow:0 0 0 2px rgba(0,0,0,.1)}
  .reload-cap{line-height:1.2;max-width:none;flex:1;min-width:0}
  /* Layer rows in the layers box, laid out like Global Safety Net's own list:
     a small square of the layer's colour, the name, little space between. A
     row's line of detail (its count, or why it is empty) shows once it is ticked. */
  #layers .layer{gap:6px;padding:0;border-top:none;font-size:12px;line-height:1.25;align-items:center}
  #layers .layer input{margin:0}
  #layers .swatch{width:10px;height:10px;border-radius:2px;margin:0}
  #layers .layer .un{display:none;font-size:11px;line-height:1.3}
  /* The source's own site, beside the title. A link inside a label is not
     passed on to the tick, so opening it does not turn the layer on. */
  #layers .nm .src{margin-left:5px;color:var(--dim);text-decoration:none;font-size:10.5px;opacity:.7}
  #layers .nm .info{display:inline-block;margin-left:5px;width:12px;height:12px;line-height:12px;border-radius:50%;
    border:1px solid var(--dim);color:var(--dim);font:italic 600 9px/12px Georgia,serif;text-align:center;opacity:.75;cursor:help;vertical-align:1px}
  #layers .nm .info:hover,#layers .nm .info:focus{opacity:1;color:var(--bone);border-color:var(--bone);outline:none}
  #row-tip{position:fixed;z-index:60;background:var(--peat,#17150F);color:var(--bone,#DCD6C6);border:1px solid var(--rule,#322E27);
    border-radius:4px;padding:8px 10px;font-size:12px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.45);pointer-events:none;max-height:50vh;overflow:hidden}
  #row-tip[hidden]{display:none}
  #layers .facet.wms-legend{padding:4px 8px 6px 30px;max-height:180px;overflow:auto}
  #layers .facet.wms-legend img{max-width:100%;display:block}
  #layers .nm .src:hover{color:var(--bone);opacity:1}
  #layers .layer:has(> input:checked){align-items:flex-start}
  #layers .layer:has(> input:checked){padding:2px 0}
  #layers .layer:has(> input:checked) > input,#layers .layer:has(> input:checked) > .swatch{margin-top:2px}
  #layers .layer:has(> input:checked) .un{display:block}
  #layers .layer.parent .un{display:block}
  #layers .facet{padding:1px 0 5px 22px}
  /* A row's own filters: the filter's name on its own line, its chips under
     it, and a long list held to a few rows that scroll rather than pushing
     the rest of the box off the screen. */
  #layers .facet-set{display:block}
  #layers .facet-set .fl{display:flex;align-items:center;gap:6px;margin:3px 0 2px;
    color:var(--dim);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
  #layers .facet-set .fl .chip{text-transform:none;letter-spacing:0;padding:0 5px}
  #layers .facet-set .fl select{margin-left:auto}
  #layers .facet-set .fv{display:flex;flex-wrap:wrap;gap:4px;max-height:96px;overflow:auto;padding-right:3px}
  #layers .facet-set .chip em{font-style:normal;opacity:.6;font-size:10.5px}
  #layers .facet-set .sm-legend{margin-top:5px}
  #layers .kids{margin:0 0 1px 9px}
  #layers .group{margin:0}
  /* The Satellite basemap's planetary-defence frame (see DEFENCE in app.js).
     A faint vignette (the corner brackets went on 22 September: they read as a
     game screen); none of it takes clicks or
     covers the middle of the map. The scan line that used to sweep down the
     screen is gone: a bar crossing the map every eleven seconds is an arcade
     screen, not an instrument, and it drew attention away from the map it was
     supposed to be framing. */
  #defence-hud{position:absolute;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(8,7,10,.18) 100%)}
  #defence-hud[hidden]{display:none}
  .defence-ping{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
    border:1px solid rgba(232,223,208,.32);pointer-events:none;z-index:2;animation:defence-ping .7s ease-out forwards}
  @keyframes defence-ping{to{transform:scale(3.4);opacity:0}}
  @media (prefers-reduced-motion: reduce){.defence-ping{animation:none;display:none}}
  /* The layers box rolls up whole: the box shrinks to its heading. */
  .left-col .panel.shut{flex:0 0 auto;height:auto !important}
  /* A page panel sets display:flex, which would otherwise override hidden. */
  .companion[hidden]{display:none !important}
  .space-back{position:fixed;right:14px;top:14px;z-index:60;font:inherit;font-size:14px;
    color:var(--bone);background:rgba(11,16,23,.86);border:1px solid var(--rule);border-radius:4px;
    padding:11px 16px;cursor:pointer}
  .space-back:hover{border-color:var(--bone)}
  .space-back[hidden]{display:none}
  .space-earth{position:fixed;left:50%;top:50%;z-index:60;transform:translate(-50%,-50%);
    border:1px solid transparent;border-radius:50%;background:none;color:var(--bone);
    font:inherit;font-size:12.5px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
  .space-earth[hidden]{display:none}
  .space-earth span{opacity:0;padding:4px 8px;background:rgba(11,16,23,.7);border-radius:3px}
  .space-earth:hover{border-color:rgba(220,214,198,.45)}
  .space-earth:hover span{opacity:1}
  .space-edge{position:fixed;inset:0;z-index:59;pointer-events:none}
  .space-edge[hidden]{display:none}
  .space-edge .se{position:absolute;pointer-events:auto}
  .space-edge .t{left:0;right:0;top:0;height:46px}
  .space-edge .b{left:0;right:0;bottom:0;height:34px}
  .space-edge .l{top:0;bottom:0;left:0;width:34px}
  .space-edge .r{top:0;bottom:0;right:0;width:34px}
  .leave-row{display:block}
  .leave-row .leave{display:inline-block;margin:2px 0 4px;font:inherit;color:var(--bone);background:none;
                    border:1px solid var(--rule);border-radius:3px;padding:4px 10px;cursor:pointer}
  .leave-row .leave:hover{border-color:var(--bone)}
  .leave-row .un{display:block}
  .fit-box{position:fixed;left:12px;bottom:12px;z-index:61;max-width:340px;padding:10px 12px;
           background:rgba(11,16,23,.9);border:1px solid var(--rule);color:var(--bone);font-size:12px}
  .fit-box code{display:block;margin-top:6px;color:var(--dim);word-break:break-all}

  /* Three boxes down the left: the name, the settings, the layers. */
  /* The right edge of the layers column is a handle: drag it out for long
     layer names, drag it back for more map. Double-click puts it back. */
  .col-edge{position:absolute;top:0;right:-7px;width:12px;bottom:0;cursor:ew-resize;
    z-index:6;touch-action:none;pointer-events:auto}
  .col-edge::before{content:"";position:absolute;top:50%;right:5px;width:2px;height:34px;
    margin-top:-17px;border-radius:2px;background:var(--rule)}
  .col-edge:hover::before{background:var(--dim)}
  .left-col{position:absolute;top:16px;left:16px;width:var(--left-w);bottom:calc(16px + var(--legend-h,0px));
    display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .left-col .panel{flex:1 1 auto}
  /* The view and basemap box, top right; the news wires box sits under it. */
  .right-col{position:absolute;top:16px;right:9px;width:var(--box-w);z-index:3;max-height:48vh;
    display:flex;flex-direction:column;pointer-events:none}
  .right-col > *{pointer-events:auto;background:rgba(31,28,21,.94);border:1px solid var(--rule);
    font-size:13.5px;line-height:1.5;backdrop-filter:blur(6px);overflow:auto}
  .right-col.away{opacity:0;pointer-events:none;transition:opacity .5s ease}
  /* The layers box as a table of contents. */
  .toc-head{display:flex;align-items:baseline;gap:6px;width:100%;background:none;border:0;cursor:pointer;
    font:inherit;text-align:left;padding:3px 0}
  .toc-head:hover{color:#fff}
  .toc-arrow{display:inline-block;width:10px;color:var(--dim);transition:transform .12s}
  .toc-head[aria-expanded="true"] .toc-arrow{transform:rotate(90deg)}
  .toc-n{margin-left:auto;color:var(--dim);font-size:10.5px;font-weight:400;letter-spacing:0;text-transform:none}
  .toc-body{padding-left:6px}
  .toc-body[hidden]{display:none}
  .toc-note{color:var(--dim);font-size:11px;font-style:italic;margin:2px 0 6px 16px}
  .left-col > *{pointer-events:auto;background:rgba(31,28,21,.94);border:1px solid var(--rule);
    font-size:13.5px;line-height:1.5;backdrop-filter:blur(6px)}
  .title-box{display:flex;align-items:center;gap:8px;padding:9px 12px 10px}
  .ctrl-box{padding:9px 12px 10px}
  .panel{min-height:0;overflow:auto;padding:10px 13px 0;display:flex;flex-direction:column}
  .title-box h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em;flex:1}
  .p-roll{background:none;border:0;color:var(--dim);font-size:13px;line-height:1;cursor:pointer;padding:2px 4px}
  .p-roll:hover{color:var(--bone)}
  .panel-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;
    background:rgba(31,28,21,.94);padding:1px 0 5px;color:var(--dim);font-size:11px;
    letter-spacing:.06em;text-transform:uppercase}
  .panel.shut{height:auto;max-height:none;overflow:hidden}
  .panel.shut > *{display:none}
  .panel.shut > .panel-head{display:flex}
  .all-btns{display:flex;gap:4px;margin-left:auto;margin-right:6px;text-transform:none;letter-spacing:0}
  /* Story titles in a news mark's box: plain light text, not link purple. */
  .wire-pop a{color:#F2EEE6;text-decoration:none}
  .wire-pop-list{max-height:260px;overflow:auto;padding-right:4px}
  .wire-pop-sort{display:flex;align-items:center;gap:6px;margin:3px 0 2px;font-size:11.5px;color:var(--dim)}
  /* Six rows of menus would push the list out of the box, so they scroll
     together and the stories keep their own room underneath. */
  .wire-pop-sort > :first-child{flex:0 0 62px}
  .wire-pop-filters{max-height:150px;overflow:auto;padding-right:4px}
  .wire-pop-sort select{flex:1;font:inherit;color:var(--bone);background:var(--peat,#17150F);
    border:1px solid var(--rule);border-radius:2px;padding:1px 4px}
  .wire-pop a:hover{text-decoration:underline;text-decoration-color:var(--dim)}

  /* The settings box: names only, close together. */
  .ctrl-box .layer{padding:3px 0;gap:7px;border-top:none}
  .ctrl-box .bm-h{margin:6px 0 2px}
  .ctrl-box .bm-h:first-child{margin-top:0}
  .sect-head{display:flex;align-items:center;justify-content:space-between}
  .sect-head .bm-h{margin:0}
  .sect + .sect{margin-top:7px;padding-top:6px;border-top:1px solid var(--rule)}
  .sect.shut .sect-body{display:none}
  /* How to tilt: small notes to the right of the terrain tick box. */
  .terrain-row{display:flex;gap:8px;align-items:flex-start;margin-top:4px}
  .terrain-row > .layer{flex:0 0 auto}
  .how-boxes{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .how{margin:0;padding:3px 6px;border:1px solid var(--rule);border-radius:2px;
    color:var(--dim);font-size:10.5px;line-height:1.35}
  .how b{color:var(--bone);font-weight:600;margin-right:3px}
  .view-row{display:flex;align-items:stretch;gap:9px}
  .view-choices{flex:1;min-width:0}
  .ctrl-box .leave{flex:1 1 55%;align-self:stretch;font:inherit;font-size:17px;font-weight:600;line-height:1.2;
    color:var(--bone);background:rgba(92,110,119,.18);border:1px solid var(--slate);border-radius:3px;
    padding:10px 14px;cursor:pointer;text-align:center}
  .ctrl-box .leave:hover{border-color:var(--bone)}

  .layer{display:flex;gap:9px;align-items:flex-start;padding:7px 0;
    border-top:1px solid var(--rule);cursor:pointer}
  .layer:first-of-type{border-top:none}
  .layer input{margin:3px 0 0;accent-color:var(--moss);flex:none}
  .layer .body{min-width:0}
  .layer .nm{display:block}
  .layer .un{color:var(--dim);font-size:12px}
  .swatch{width:10px;height:10px;border-radius:50%;flex:none;margin:4px 0 0}
  .bm-h{margin:0 0 2px;color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .pending-note{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--rule);
    color:var(--dim);font-size:12px;line-height:1.45}

  .kinds{padding:0 0 6px;border-bottom:1px solid var(--rule);margin-bottom:6px}
  .kinds .facet{padding:0 0 6px}
  .kinds .bm-h{margin:4px 0 3px}
  .facet{display:flex;flex-wrap:wrap;gap:4px;padding:0 0 9px 27px}
  .chip{font:inherit;font-size:11.5px;line-height:1.5;background:none;color:var(--dim);
    border:1px solid var(--rule);padding:1px 6px;cursor:pointer;border-radius:2px}
  .chip:hover{color:var(--bone);border-color:var(--dim)}
  .chip.on{color:var(--peat);background:var(--bone);border-color:var(--bone)}
  .chip.reset{font-style:italic}

  .note{margin-top:15px;padding-top:13px;border-top:1px solid var(--rule);
    color:var(--dim);font-size:12px}

  /* Guerillamap companion. A sibling element of #map, not a MapLibre layer or
     control — so the basemap grading and the data layers are untouched by it,
     and opening it only changes the map container's height. */
  /* Nested group. Indented and hairlined so the children read as belonging to
     the parent rather than as six more top-level layers. */
  .group{margin:2px 0}
  .layer.parent{display:flex;align-items:flex-start;gap:7px}
  .disc{background:none;border:0;color:var(--dim);cursor:pointer;padding:0 1px;
    font-size:11px;line-height:1.5;flex:0 0 auto}
  .disc:hover{color:var(--bone)}
  .kids{border-left:1px solid var(--rule);margin:1px 0 3px 9px}
  .kids[hidden]{display:none}
  .layer.child{padding-left:13px}
  /* A child row's title is a layer's title like any other, so it reads in the
     same ink. The indent and the rule down the left already say it sits inside
     a group; dimming it as well said, wrongly, that it mattered less. */
  .layer.child .nm{color:inherit}

  /* Guerillamap opens like every other outside page: a panel along the bottom,
     over the map, with a strip and bar to drag it taller or shorter. */
  .gm{position:fixed;right:0;bottom:0;left:0;height:46vh;z-index:40;background:var(--peat,#17150F);
      border-top:1px solid var(--rule,#322E27);display:flex;flex-direction:column}
  .gm[hidden]{display:none}
  .gm-grab{height:9px;cursor:ns-resize;touch-action:none;display:flex;justify-content:center;align-items:center}
  .gm-grab span{width:44px;height:3px;border-radius:2px;background:var(--rule,#322E27)}
  .gm-bar{display:flex;align-items:center;gap:11px;padding:2px 12px 6px;font-size:12.5px;color:var(--dim);cursor:ns-resize;touch-action:none}
  .gm-bar .nm{color:var(--bone)}
  .gm-bar label{display:flex;align-items:center;gap:5px;cursor:pointer}
  .gm-bar input{accent-color:var(--moss)}
  .gm-bar a{color:var(--slate,#8A9DA6)}
  .gm-bar .sp{margin-left:auto}
  .gm-bar button{font:inherit;background:none;color:var(--dim);border:1px solid var(--rule);border-radius:2px;padding:1px 7px;cursor:pointer}
  .gm-bar button:hover{color:var(--bone);border-color:var(--dim)}
  .gm-frame{flex:1;width:100%;border:0}
  .gm-wait{margin:0;padding:7px 12px;font-size:12px;color:var(--dim)}

  /* Legend. Bottom right, above the attribution, narrow enough not to cover
     the map. Lists only what is switched on. */
  #legend{position:absolute;left:16px;bottom:16px;z-index:2;width:var(--left-w);max-width:none;
    background:rgba(17,21,15,.88);border:1px solid var(--rule);border-radius:2px;
    padding:6px 8px;font-size:11px;line-height:1.35;color:var(--dim);
    max-height:42vh;overflow-y:auto}
  #legend[hidden]{display:none}
  /* Zoom in, zoom out, the compass and the whole-world button: two by two,
     in the view row between the view choices and Leave Earth. */
  .view-zoom{flex:0 0 auto;align-self:center}
  .view-row .view-choices{flex:0 0 auto}
  /* Snap back over Leave Earth, to the right of the zoom buttons. */
  .view-go{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
  /* Highlighted like Leave Earth under it (asked for 23 September). */
  .view-go .snap{font:inherit;font-size:11.5px;font-weight:600;line-height:1.2;color:var(--bone);
    background:rgba(92,110,119,.18);border:1px solid var(--slate);border-radius:3px;padding:4px 6px;cursor:pointer}
  .view-go .snap:hover{border-color:var(--bone)}
  .view-go .leave{flex:1 1 auto!important;min-width:0;font-size:15px!important;padding:6px 8px!important}
  .terrain-left{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
  .compass-holder{display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:14px}
  .compass-cap{font-size:10px;line-height:1.2;color:var(--dim);text-align:center;max-width:84px}
  .compass-holder .maplibregl-ctrl-group{margin:0;border-radius:3px;box-shadow:none;
    border:1px solid var(--rule);background:rgba(23,21,15,.6);display:inline-block}
  .compass-holder button{width:30px;height:30px;background-color:transparent}
  .compass-holder .maplibregl-ctrl-icon{filter:invert(1) brightness(.86)}
  .view-zoom .maplibregl-ctrl-group{position:static;margin:0;display:grid;grid-template-columns:26px;
    border-radius:3px;box-shadow:none;border:1px solid var(--rule);background:rgba(23,21,15,.6);overflow:hidden}
  .view-zoom .maplibregl-ctrl-group button{width:26px;height:26px;background-color:transparent;
    border:0;border-top:0!important}
  .view-zoom .maplibregl-ctrl-group button + button{border-top:1px solid var(--rule)!important}
  .view-zoom .maplibregl-ctrl-icon{filter:invert(1) brightness(.86)}
  .view-zoom .to-world{display:flex;align-items:center;justify-content:center;color:#DBD6CA;cursor:pointer}
  .view-zoom .to-world:hover{color:var(--bone)}
  .to-globe{font:inherit;font-size:12.5px;color:var(--bone);background:none;border:1px solid var(--rule);
    border-radius:3px;padding:4px 8px;cursor:pointer;white-space:nowrap}
  .to-globe:hover{border-color:var(--bone)}

  /* The grip each box is pulled by. */
  /* The handle that pulls a box open or shut. It was a hairline nobody
     found: now a bar with a lip above and below it, brighter on hover. */
  .pull-grip{flex:none;height:16px;cursor:ns-resize;position:relative;touch-action:none}
  .pull-grip::before{content:"";position:absolute;left:50%;top:50%;width:46px;height:4px;margin:-2px 0 0 -23px;
    border-radius:2px;background:var(--dim);opacity:.7}
  .pull-grip::after{content:"";position:absolute;left:50%;top:50%;width:70px;height:12px;margin:-6px 0 0 -35px;
    border-radius:3px;border:1px solid var(--rule)}
  .pull-grip:hover::before{background:var(--bone);opacity:1}
  .pull-grip:hover::after{border-color:var(--dim)}
  /* Pulled right down, a box stops scrolling what it is hiding, so no
     scrollbar is left standing down the side of an empty box. */
  .pulled-shut{overflow:hidden !important}
  /* Live rows say so, beside the title. */
  #layers .nm .live{margin-left:5px;padding:0 3px;border:1px solid var(--rule);border-radius:2px;
    color:var(--dim);font-size:8.5px;letter-spacing:.08em;vertical-align:1px}
  #layers .nm .live.notlive{border-style:dashed;opacity:.75}
  #layers .nm .refresh{margin-left:5px;font-size:9px;color:var(--dim);opacity:.8;white-space:nowrap}
  .panel,#legend{overflow:auto}
  /* The grip stays on the box's edge while its contents scroll under it. */
  .panel .pull-grip{position:sticky;bottom:0;margin-top:8px;background:rgba(31,28,21,.94)}
  #legend .pull-grip{position:sticky;top:0;background:rgba(17,21,15,.88)}
  .lg-hd{color:var(--bone);font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;margin-bottom:4px}
  .lg-row{display:flex;align-items:baseline;gap:6px;margin:2px 0}
  .lg-on{flex:0 0 auto;width:11px;height:11px;margin:0;accent-color:#8A9DA6;cursor:pointer}
  .lg-sw{flex:0 0 auto;width:8px;height:8px;border-radius:50%;margin-top:3px}
  .lg-hollow{background:none;border:1px solid var(--dim)}
  .lg-nm{color:var(--bone);flex:0 0 auto}
  .lg-un{color:var(--dim);font-size:10px}
  .lg-rule{border-top:1px solid var(--rule);margin:5px 0 3px}

  .maplibregl-popup-content{background:var(--peat2);color:var(--bone);
    border:1px solid var(--rule);border-radius:2px;font-size:13px;padding:11px 13px;max-width:260px}
  /* Not inside a site map's own box (.wtyg-box): those carry their map's styling. */
  /* A box that lists every field a source publishes can be long: it scrolls rather than running off the screen. */
  .maplibregl-popup:not(.wtyg-box) .maplibregl-popup-content{max-height:60vh;overflow-y:auto;overflow-wrap:anywhere}
  .maplibregl-popup:not(.wtyg-box) .maplibregl-popup-content b{display:block;margin-bottom:3px}
  .maplibregl-popup:not(.wtyg-box) .maplibregl-popup-content .meta{color:var(--dim);font-size:12px;margin-top:5px}
  .maplibregl-popup-tip{border-top-color:var(--peat2)!important;border-bottom-color:var(--peat2)!important}
  .maplibregl-popup-close-button{color:var(--dim);font-size:17px}
</style>

<body>
<!-- The sky the map sits in: drawn in app.js, behind everything. -->
<canvas id="stars" class="stars" aria-hidden="true"></canvas>
<!-- NASA's Eyes on the Solar System. Loaded as the map nears the hand-over
     point, and given the whole screen, and every click, once it is crossed. -->
<iframe id="space" class="space" title="NASA's Eyes on the Solar System"
        referrerpolicy="no-referrer" hidden></iframe>
<!-- The screen's own edge while Eyes has the middle: scroll in here, or
     double-click, to come back to the map. -->
<div class="space-edge" id="spaceEdge" hidden aria-hidden="true">
  <div class="se t"></div><div class="se b"></div><div class="se l"></div><div class="se r"></div>
</div>
<button class="space-back" id="spaceBack" hidden>&#8592; Back to the map</button>
<div id="map"></div>

<!-- The reload button is plain page markup with its own handler, so it is
     there and clickable from the first moment, before the map has loaded and
     even if the map's script is slow or has failed. Once the view box exists
     it is moved beside the zoom buttons. -->
<div id="defence-hud" hidden></div>
<div class="reload-wrap reload-early" id="reload-wrap">
  <button type="button" id="reload-map" aria-label="Reload the map"
          onclick="try{var v=window.__culpritsView;if(v)sessionStorage.setItem('culprits-view',v)}catch(e){}location.reload()">&#8635;</button>
  <span class="reload-cap">Stuck? Reload here, or press ⌘R (Ctrl-R)</span>
</div>
<div class="right-col">
  <div id="basemaps" class="ctrl-box"></div>
</div>

<div class="left-col">
  <div class="panel">
    <div class="panel-head">
      <span>Layers</span>
      <span class="all-btns"><button type="button" class="chip" id="layersAllOn" title="Tick every layer">All on</button><button type="button" class="chip" id="layersAllOff" title="Untick every layer">All off</button></span>
      <button class="p-roll" id="panelRoll" title="Roll the layer list up or down" aria-expanded="true">&#9662;</button>
    </div>
    <div id="layers"></div>
    <p class="note" id="note"></p>
  </div>
</div>

<div id="legend" hidden></div>

<div class="gm" id="gm" hidden>
  <div class="gm-grab" title="Drag up or down to resize"><span></span></div>
  <div class="gm-bar">
    <span class="nm">Guerillamap overlays</span>
    <label><input type="checkbox" id="gmFollow" checked> follow this map</label>
    <a id="gmOut" href="https://guerillamap.com/" target="_blank" rel="noopener">open &#8599;</a>
    <span class="sp"></span>
    <button id="gmClose">close</button>
  </div>
  <p class="gm-wait" id="gmWait">Loading guerillamap&#8230;</p>
  <iframe class="gm-frame" id="gmFrame"
          title="Guerillamap fossil fuel, nuclear and active fire overlays"
          referrerpolicy="no-referrer" loading="lazy"></iframe>
</div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<script>
/* HOLOGRAM VIEW: a handle on the map for the hologram script at the bottom.
   app.js keeps its map inside a block where other scripts cannot see it, so
   this notes the map the first time it subscribes to an event, then puts
   MapLibre back exactly as it was. Nothing in app.js changes. */
(function () {
  if (!window.maplibregl || !maplibregl.Map) return;
  const P = maplibregl.Map.prototype, own = Object.prototype.hasOwnProperty.call(P, "on"), orig = P.on;
  P.on = function () {
    if (!window.__holoMap) window.__holoMap = this;
    if (own) P.on = orig; else delete P.on;
    return orig.apply(this, arguments);
  };
})();
</script>
<script src="./app.js"></script>
<script src="./wire.js"></script>
<!-- The drag bar on the layers box's right edge (made by columnEdge() in
     app.js) ran the full height of the column, so it stayed standing beside
     empty map when the box was rolled up or pulled shorter. It is held to the
     box's own height here, and follows it as the box changes. -->
<script id="col-edge-fit">
(function () {
  const col = document.querySelector(".left-col");
  if (!col || !window.ResizeObserver) return;
  let watched = null;
  const ro = new ResizeObserver(fit);
  function fit() {
    const edge = col.querySelector(".col-edge"), panel = col.querySelector(".panel");
    if (!edge || !panel) return;
    const h = panel.offsetHeight + "px";
    // Only when it changes, so this never answers its own change.
    if (edge.style.bottom !== "auto") edge.style.bottom = "auto";
    if (edge.style.height !== h) edge.style.height = h;
  }
  function watch() {
    const panel = col.querySelector(".panel");
    if (panel && panel !== watched) { if (watched) ro.unobserve(watched); ro.observe(panel); watched = panel; }
    fit();
  }
  watch();
  // The bar is added after the map loads; the box is rolled with a class.
  new MutationObserver(watch).observe(col, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "style"] });
})();
</script>
<!-- HOLOGRAM VIEW (2 of 2). Adds a "Hologram view" switch to the Basemap box.
     On: the basemap is hidden (or dimmed underneath) and Natural Earth country
     outlines are drawn as a glowing wireframe, with OpenStreetMap detail close
     in, the planet's rim, stars and 80s effects as options. Off: the basemap
     is put back by the map's own code. No data layer, popup, filter or control
     is removed or changed, except that the markers' glow turns blue-cyan while
     the view is on. -->
<script id="holo-script">
(function () {
  "use strict";
  const map = window.__holoMap;
  if (!map || typeof map.getStyle !== "function") return;

  const HOLO = {
    // Natural Earth, pinned to one release so the file never changes under you.
    url: (res) => `https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-${res}.json`,
    res: "50m",               // "50m" or "110m"
    gridStep: 15,             // degrees between grid lines
    slowFrameMs: 40,          // if moving the map is slower than this per frame
                              // with the hologram on (and clearly slower than
                              // without it), it switches to 110m and says so
  };
  // The same two sources the Country outlines basemap uses, under the same
  // names and settings, so whichever of the two adds them first, the other
  // reuses them and no square is downloaded twice.
  const OSM_SOURCE = { type: "vector", url: "https://tiles.openfreemap.org/planet",
    attribution: '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © OpenStreetMap contributors' };
  const RELIEF_SOURCE = { type: "raster-dem", tiles: ["https://tiles.mapterhorn.com/{z}/{x}/{y}.webp"],
    encoding: "terrarium", tileSize: 512, maxzoom: 12,
    attribution: '<a href="https://mapterhorn.com/attribution" target="_blank" rel="noopener">© Mapterhorn</a>' };

  // The basemap's own layers. Everything else on the map is left alone.
  const BASE_IDS = ["bg", "world-fill", "base", "base-s2", "base-close", "hillshade",
    "atlas-washes", "atlas-plate", "labels", "outline-ocean", "outline-land", "outline-line",
    "sat-relief-colour", "sat-relief-seabed", "sat-relief-shade", "sat-relief-depth", "sat-relief-sea",
    // the Country outlines basemap's close-in detail (OUTLINE_IDS in app.js)
    "outline-relief", "outline-water", "outline-green", "outline-town", "outline-waterway",
    "outline-rail", "outline-road-minor", "outline-road", "outline-road-major", "outline-buildings",
    // 3D terrain's stone-coloured buildings (setBuildings3D in app.js). Left
    // up, they stood over the hologram close in and hid it; the hologram has
    // its own glass buildings at the same heights.
    "buildings-3d"];
  // Hologram layers, bottom to top.
  const EARTH_IDS = ["holo-earth", "holo-earth-flat"];
  const DETAIL_IDS = ["holo-relief", "holo-osm-water", "holo-osm-waterway", "holo-osm-road",
                      "holo-osm-boundary", "holo-osm-building-line", "holo-osm-building"];
  const HOLO_IDS = EARTH_IDS.concat(["holo-grat"], DETAIL_IDS.slice(0, 5), ["holo-glow", "holo-fringe", "holo-line"], DETAIL_IDS.slice(5));

  // The sub-switches, kept for this browser only (nothing else depends on them).
  // Every option starts on except the basemap underneath. The key is new
  // (was "culprits-holo") so choices kept under the old defaults, with place
  // names off, do not carry over.
  const opt = { grat: true, floor: true, stars: true, detail: true, names: true, fx: true, under: false, tint: 55, fold: false };
  const OPT_KEY = "culprits-holo-2";
  try { Object.assign(opt, JSON.parse(localStorage.getItem(OPT_KEY) || "{}")); } catch (e) { /* defaults */ }
  const keepOpt = () => { try { localStorage.setItem(OPT_KEY, JSON.stringify(opt)); } catch (e) { /* not kept */ } };
  // The Place names box in the View section governs every name on the map,
  // the hologram's included.
  const namesOn = () => { const b = document.getElementById("names-toggle"); return !b || b.checked; };

  let on = false;
  let savedVis = new Map();        // basemap layer -> its visibility before the hologram
  let savedPaint = new Map();      // "layer|prop" -> marker glow value before the hologram
  let savedSky = null;
  const geoCache = {};
  let resNote = "";

  const cssVar = (n, fb) => (getComputedStyle(document.documentElement).getPropertyValue(n).trim() || fb);
  const colours = () => ({
    bg: cssVar("--holo-bg", "#0a1230"), earth: cssVar("--holo-earth", "#111d45"),
    line: cssVar("--holo-line", "#7fb8d9"), glow: cssVar("--holo-glow", "#5b9cc8"),
    grid: cssVar("--holo-grid", "rgba(127,184,217,0.15)"), detail: cssVar("--holo-detail", "#6d9fc0"),
    fringe: cssVar("--holo-fringe", "#8e86c8"),
  });
  // Any CSS colour -> [r, g, b], so a colour can be used at its own alphas.
  function rgbOf(c) {
    const cx = document.createElement("canvas").getContext("2d");
    cx.fillStyle = "#000"; cx.fillStyle = c;
    const s = cx.fillStyle;
    if (s[0] === "#") { const n = parseInt(s.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
    const m = s.match(/[\d.]+/g) || [0, 0, 0];
    return [+m[0], +m[1], +m[2]];
  }
  const rgba = (c, a) => { const [r, g, b] = rgbOf(c); return `rgba(${r},${g},${b},${a})`; };
  const layerIds = () => typeof map.getLayersOrder === "function" ? map.getLayersOrder() : (map.getStyle().layers || []).map((l) => l.id);
  const isFlat = () => { const p = map.getProjection && map.getProjection(); return !!(p && p.type === "mercator"); };

  /* ---------- the outlines: TopoJSON arcs -> GeoJSON lines ---------- */
  // Each shared border is one arc in the file, so drawing arcs (not country
  // shapes) draws every border once, with no doubled lines. Three kinds of
  // segment are joins in the file rather than coastlines or borders, and are
  // skipped: the seam along 180° (Russia, Fiji, Antarctica), a step from one
  // side of 180° to the other (which would draw a line across the whole
  // world), and the straight edge Antarctica is closed with at the South Pole.
  function topoToLines(topo) {
    const [sx, sy] = topo.transform.scale, [tx, ty] = topo.transform.translate;
    const lines = [];
    for (const arc of topo.arcs) {
      let x = 0, y = 0, cur = [];
      for (const p of arc) {
        x += p[0]; y += p[1];
        const pt = [x * sx + tx, y * sy + ty];
        const prev = cur[cur.length - 1];
        if (prev && ((Math.abs(pt[0]) > 179.99 && Math.abs(prev[0]) > 179.99) || (pt[1] < -89.9 && prev[1] < -89.9) ||
                     Math.abs(pt[0] - prev[0]) > 180)) {
          if (cur.length > 1) lines.push(cur);
          cur = [pt];
          continue;
        }
        cur.push(pt);
      }
      if (cur.length > 1) lines.push(cur);
    }
    return { type: "Feature", properties: {}, geometry: { type: "MultiLineString", coordinates: lines } };
  }
  async function loadOutlines(res) {
    if (geoCache[res]) return geoCache[res];
    const r = await fetch(HOLO.url(res));
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return (geoCache[res] = topoToLines(await r.json()));
  }
  // Grid every 15°, with points every 2° so the lines curve on the globe.
  function graticule(step) {
    const lines = [];
    for (let lon = -180; lon < 180; lon += step) {
      const l = []; for (let lat = -85; lat <= 85; lat += 2) l.push([lon, lat]); l.push([lon, 85]); lines.push(l);
    }
    for (let lat = -75; lat <= 75; lat += step) {
      const l = []; for (let lon = -180; lon <= 180; lon += 2) l.push([lon, lat]); lines.push(l);
    }
    return { type: "Feature", properties: {}, geometry: { type: "MultiLineString", coordinates: lines } };
  }

  /* ---------- map layers ---------- */
  const empty = { type: "FeatureCollection", features: [] };
  const zfade = (z0, z1, a) => ["interpolate", ["linear"], ["zoom"], z0, 0, z1, a];
  // Straight above the basemap's top layer, so the hologram covers the
  // basemap (when it is shown underneath) and every data layer covers it.
  function holoBefore() {
    const ids = layerIds();
    let top = -1;
    ids.forEach((id, i) => { if (id !== "labels" && BASE_IDS.includes(id)) top = Math.max(top, i); });
    for (let i = top + 1; i < ids.length; i++) if (!HOLO_IDS.includes(ids[i])) return ids[i];
    return undefined;
  }
  function ensureLayers() {
    const c = colours();
    if (!map.getSource("holo-outlines")) map.addSource("holo-outlines", { type: "geojson", data: empty, tolerance: 0.2 });
    if (!map.getSource("holo-graticule")) map.addSource("holo-graticule", { type: "geojson", data: graticule(HOLO.gridStep) });
    if (!map.getSource("holo-world")) map.addSource("holo-world", { type: "geojson", data: { type: "Feature", properties: {},
      geometry: { type: "Polygon", coordinates: [[[-180, -85.0511], [180, -85.0511], [180, 85.0511], [-180, 85.0511], [-180, -85.0511]]] } } });
    if (!map.getSource("osm")) map.addSource("osm", Object.assign({}, OSM_SOURCE));
    // Place names: the map's own labels come from CARTO's light-background
    // set (dark text). This is CARTO's set for dark maps, same provider, pale
    // text with a dark edge, so it reads on the hologram.
    if (!map.getSource("holo-labels")) map.addSource("holo-labels", { type: "raster", tileSize: 256,
      tiles: ["https://a.basemaps.cartocdn.com/rastertiles/dark_only_labels/{z}/{x}/{y}@2x.png"],
      attribution: "Labels © CARTO, © OpenStreetMap" });
    if (!map.getSource("outline-dem")) map.addSource("outline-dem", Object.assign({}, RELIEF_SOURCE));
    const before = holoBefore();
    const hid = { visibility: "none" };
    const line = { visibility: "none", "line-join": "round", "line-cap": "round" };
    const osm = { source: "osm", "source-layer": undefined };
    const specs = {
      // The planet's face. On the globe a background layer is drawn on the
      // planet only; on the flat map it would fill the whole screen (stars
      // included), so the flat map gets a world-sized sheet instead.
      "holo-earth": { type: "background", layout: hid, paint: { "background-color": c.earth } },
      "holo-earth-flat": { type: "fill", source: "holo-world", layout: hid, paint: { "fill-color": c.earth, "fill-antialias": false } },
      "holo-grat": { type: "line", source: "holo-graticule", layout: line, paint: { "line-color": c.grid, "line-width": 0.8 } },
      // Close in: relief as faint light and shade, then OpenStreetMap as
      // wireframe. Relief drapes over 3D terrain like everything else.
      "holo-relief": { type: "hillshade", source: "outline-dem", minzoom: 3, layout: hid,
        paint: { "hillshade-exaggeration": 0.5, "hillshade-illumination-direction": 315,
                 "hillshade-highlight-color": rgba(c.line, 0.22), "hillshade-shadow-color": "rgba(2,5,16,0.55)",
                 "hillshade-accent-color": rgba(c.glow, 0.10) } },
      "holo-osm-water": Object.assign({}, osm, { "source-layer": "water", type: "line", minzoom: 5, layout: line,
        paint: { "line-color": c.line, "line-width": ["interpolate", ["linear"], ["zoom"], 5, 0.7, 12, 1.2], "line-opacity": zfade(5, 7.5, 0.8) } }),
      "holo-osm-waterway": Object.assign({}, osm, { "source-layer": "waterway", type: "line", minzoom: 7, layout: line,
        paint: { "line-color": c.detail, "line-width": 0.7, "line-opacity": zfade(7, 9, 0.45) } }),
      "holo-osm-road": Object.assign({}, osm, { "source-layer": "transportation", type: "line", minzoom: 6, layout: line,
        filter: ["match", ["get", "class"], ["motorway", "trunk", "primary", "secondary", "tertiary", "minor", "street", "service"], true, false],
        paint: { "line-color": c.detail,
                 "line-width": ["interpolate", ["exponential", 1.4], ["zoom"], 6, 0.4, 12, 0.9, 16, 2.4],
                 "line-opacity": ["interpolate", ["linear"], ["zoom"], 6, 0,
                   8, ["match", ["get", "class"], ["motorway", "trunk", "primary"], 0.5, 0],
                   12, ["match", ["get", "class"], ["motorway", "trunk", "primary"], 0.6, ["secondary", "tertiary"], 0.45, 0.3]] } }),
      "holo-osm-boundary": Object.assign({}, osm, { "source-layer": "boundary", type: "line", minzoom: 4, layout: line,
        filter: ["all", ["<=", ["to-number", ["get", "admin_level"], 99], 4], ["!=", ["to-number", ["get", "maritime"], 0], 1]],
        paint: { "line-color": c.line, "line-width": ["match", ["to-number", ["get", "admin_level"], 99], 2, 1.1, 0.7],
                 "line-dasharray": [3, 2],
                 "line-opacity": ["interpolate", ["linear"], ["zoom"], 4, 0,
                   6, ["match", ["to-number", ["get", "admin_level"], 99], 2, 0.75, 0.35]] } }),
      // The glow: a wide, blurred, faint line under the thin one. This is the
      // WebGL version of an SVG blur filter, and costs next to nothing to draw.
      "holo-glow": { type: "line", source: "holo-outlines", layout: line,
        paint: { "line-color": c.glow, "line-opacity": 0.32, "line-blur": 3,
                 "line-width": ["interpolate", ["linear"], ["zoom"], 1, 3.5, 6, 5] } },
      // 80s colour fringe: the same lines a pixel over, in another hue, the
      // way a vector tube's beams never quite lined up.
      "holo-fringe": { type: "line", source: "holo-outlines", layout: line,
        paint: { "line-color": c.fringe, "line-opacity": 0.35, "line-translate": [1.2, 0.6],
                 "line-width": ["interpolate", ["linear"], ["zoom"], 1, 0.7, 6, 1] } },
      "holo-line": { type: "line", source: "holo-outlines", layout: line,
        paint: { "line-color": c.line, "line-opacity": 0.95,
                 "line-width": ["interpolate", ["linear"], ["zoom"], 1, 0.8, 6, 1.2] } },
      "holo-osm-building-line": Object.assign({}, osm, { "source-layer": "building", type: "line", minzoom: 13, layout: line,
        paint: { "line-color": c.line, "line-width": 0.6, "line-opacity": zfade(13, 14.5, 0.55) } }),
      // Buildings as glass blocks at their mapped height: they stand up in a
      // tilted view and on 3D terrain.
      "holo-osm-building": Object.assign({}, osm, { "source-layer": "building", type: "fill-extrusion", minzoom: 13, layout: hid,
        paint: { "fill-extrusion-color": c.glow,
                 "fill-extrusion-height": ["coalesce", ["get", "render_height"], 6],
                 "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], 0],
                 "fill-extrusion-opacity": ["interpolate", ["linear"], ["zoom"], 13, 0, 14.5, 0.28] } }),
    };
    for (const id of HOLO_IDS) {
      if (map.getLayer(id)) continue;
      try { map.addLayer(Object.assign({ id }, specs[id]), before); }
      catch (e) { console.warn("[culprits] hologram layer", id, e.message || e); }
    }
    // Names go over everything, as the map's own labels do.
    if (!map.getLayer("holo-labels")) {
      try { map.addLayer({ id: "holo-labels", type: "raster", source: "holo-labels", layout: { visibility: "none" },
        paint: { "raster-opacity": 0.85, "raster-saturation": -1, "raster-fade-duration": 0 } }); }
      catch (e) { console.warn("[culprits] hologram layer holo-labels", e.message || e); }
    }
    outlineFade();
  }
  // With the close-in detail on, the Natural Earth lines step back as the
  // OpenStreetMap ones come in; they stay faintly, in case those are slow.
  function outlineFade() {
    if (!map.getLayer("holo-line")) return;
    const f = (a) => opt.detail ? ["interpolate", ["linear"], ["zoom"], 6, a, 9, a * 0.4] : a;
    map.setPaintProperty("holo-line", "line-opacity", f(0.95));
    map.setPaintProperty("holo-glow", "line-opacity", f(0.32));
    map.setPaintProperty("holo-fringe", "line-opacity", f(0.35));
  }
  function recolourLayers() {
    const c = colours();
    const set = (id, prop, v) => { if (map.getLayer(id)) map.setPaintProperty(id, prop, v); };
    set("holo-grat", "line-color", c.grid);
    set("holo-glow", "line-color", c.glow);
    set("holo-line", "line-color", c.line);
    set("holo-fringe", "line-color", c.fringe);
    set("holo-osm-water", "line-color", c.line);
    set("holo-osm-boundary", "line-color", c.line);
    set("holo-osm-building-line", "line-color", c.line);
    set("holo-osm-waterway", "line-color", c.detail);
    set("holo-osm-road", "line-color", c.detail);
    set("holo-osm-building", "fill-extrusion-color", c.glow);
    earthPaint();
  }
  // The planet's face: solid in the hologram's colour, or, with a basemap
  // underneath, a see-through navy wash over it at the strength chosen.
  function earthPaint() {
    const c = colours();
    const col = opt.under ? rgba(c.bg, opt.tint / 100) : c.earth;
    if (map.getLayer("holo-earth")) map.setPaintProperty("holo-earth", "background-color", col);
    if (map.getLayer("holo-earth-flat")) map.setPaintProperty("holo-earth-flat", "fill-color", col);
  }
  function showHolo() {
    const vis = (id, v) => { if (map.getLayer(id) && map.getLayoutProperty(id, "visibility") !== v) map.setLayoutProperty(id, "visibility", v); };
    const flat = isFlat();
    const earthOn = on && (!opt.under || opt.tint > 0);
    vis("holo-earth", earthOn && !flat ? "visible" : "none");
    vis("holo-earth-flat", earthOn && flat ? "visible" : "none");
    vis("holo-grat", on && opt.grat ? "visible" : "none");
    for (const id of DETAIL_IDS) vis(id, on && opt.detail ? "visible" : "none");
    vis("holo-glow", on ? "visible" : "none");
    vis("holo-line", on ? "visible" : "none");
    vis("holo-fringe", on && opt.fx ? "visible" : "none");
    vis("holo-labels", on && opt.names && namesOn() ? "visible" : "none");
    document.body.classList.toggle("holo-on", on);
    document.body.classList.toggle("holo-floor-on", on && opt.floor);
    document.body.classList.toggle("holo-stars-on", on && opt.stars);
    document.body.classList.toggle("holo-fx-on", on && opt.fx);
  }
  async function setRes(res, why) {
    try {
      const geo = await loadOutlines(res);
      HOLO.res = res;
      if (map.getSource("holo-outlines")) map.getSource("holo-outlines").setData(geo);
      resNote = why || "";
    } catch (e) {
      if (res === "50m") return setRes("110m", "1:50m outlines could not load, showing 1:110m");
      resNote = "Outlines could not load (" + (e.message || e) + ")";
    }
    updateText();
  }

  /* ---------- the basemap: hidden, or shown underneath ---------- */
  // The Satellite basemap switches on its own frame (red halos, vignette,
  // sky). The hologram is its own frame, so that one goes off while it shows.
  function defenceOff() { if (typeof window.defenceMode === "function") window.defenceMode(false); }
  function defenceShowing() { const h = document.getElementById("defence-hud"); return !!(h && !h.hidden); }
  const basemapTicked = () => { const r = document.querySelector('#basemaps input[name="basemap"]:checked'); return r ? r.value : null; };
  // Which basemap layers the hologram hides: all of them, or with a basemap
  // underneath, only the tile provider's place names.
  // Terrain's stone buildings go either way: they would stand over the wireframe.
  const hiddenIds = () => opt.under ? ["labels", "buildings-3d"] : BASE_IDS;
  function hideBase() {
    for (const id of hiddenIds()) {
      if (!map.getLayer(id)) continue;
      const v = map.getLayoutProperty(id, "visibility") || "visible";
      if (!savedVis.has(id)) savedVis.set(id, v);
      if (v !== "none") map.setLayoutProperty(id, "visibility", "none");
    }
  }
  // Everything back as it was, then the map's own code decides the basemap,
  // exactly as without the hologram: the right background for globe or flat,
  // and whichever basemap is ticked in the Basemap box.
  function restoreBase() {
    for (const [id, v] of savedVis) if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", v);
    savedVis.clear();
    try { if (typeof window.skyForView === "function" && typeof window.drawnProjection === "function") window.skyForView(window.drawnProjection()); } catch (e) { /* kept */ }
    const kind = basemapTicked();
    if (typeof window.setBasemap === "function" && kind) window.setBasemap(kind);
    // Terrain may have been switched while the hologram was on.
    const t = document.getElementById("terrain-toggle");
    if (typeof window.setBuildings3D === "function" && t) window.setBuildings3D(t.checked);
  }
  function holoSky() {
    const bg = colours().bg;
    return { "sky-color": bg, "horizon-color": bg, "fog-color": bg, "atmosphere-blend": 0,
             "sky-horizon-blend": 0.5, "horizon-fog-blend": 0.5, "fog-ground-blend": 0.5 };
  }
  function frameOn() { defenceOff(); if (map.setSky) map.setSky(holoSky()); }

  /* ---------- markers: a blue-cyan glow ---------- */
  // Markers are drawn by WebGL, not as page elements, so a CSS class cannot
  // reach them. Instead the glow layers the map already draws with every
  // marker layer are recoloured, and the round cores (what shows at world
  // view) get a soft rim in the same hue. Marker fill colours, sizes,
  // filters, data and popups are untouched, and everything goes back on exit.
  // app.js names them after their marker layer: "<layer>-soft", "-haze", "-core".
  function glowLayers() {
    const out = [];
    for (const id of layerIds()) {
      if (!/-(soft|haze|core)$/.test(id)) continue;
      const l = map.getLayer(id);
      if (l && l.type === "circle" && /-soft$/.test(id)) out.push([id, "circle-color"]);
      else if (l && l.type === "heatmap" && /-haze$/.test(id)) out.push([id, "heatmap-color"]);
      else if (l && l.type === "circle" && /-core$/.test(id)) out.push([id, "circle-stroke-color"], [id, "circle-stroke-width"]);
    }
    return out;
  }
  function glowMarkers(onlyNew) {
    const glow = colours().glow, a = (x) => rgba(glow, x);
    // The same see-through steps as the map's own haze, in the hologram's hue.
    const haze = ["interpolate", ["linear"], ["heatmap-density"], 0, a(0), 0.3, a(0.12), 0.7, a(0.4), 1, a(0.6)];
    for (const [id, prop] of glowLayers()) {
      const key = id + "|" + prop;
      if (savedPaint.has(key) && onlyNew) continue;
      if (!savedPaint.has(key)) savedPaint.set(key, map.getPaintProperty(id, prop));
      map.setPaintProperty(id, prop, prop === "circle-color" ? glow : prop === "heatmap-color" ? haze
        : prop === "circle-stroke-color" ? a(0.55) : ["interpolate", ["linear"], ["zoom"], 0, 1.4, 8, 2.4]);
    }
  }
  function unglowMarkers() {
    for (const [key, v] of savedPaint) {
      const [id, prop] = key.split("|");
      // undefined puts back the style default, which is what it was.
      if (map.getLayer(id)) { try { map.setPaintProperty(id, prop, v); } catch (e) { /* kept */ } }
    }
    savedPaint.clear();
  }

  // Layers can appear while the hologram is on (a layer ticked, a basemap
  // picked, the view changed). Each style change is checked once per frame.
  let pending = false;
  function tidy() {
    if (!on || pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      if (!on) return;
      if (defenceShowing()) frameOn();
      hideBase();
      glowMarkers(true);
      if (!map.getLayer("holo-line")) { ensureLayers(); recolourLayers(); setRes(HOLO.res); }
      showHolo();
    });
  }
  map.on("styledata", tidy);
  map.on("projectiontransition", tidy);

  /* ---------- the planet's rim ---------- */
  // Asked for a point off the planet, MapLibre answers with the nearest point
  // on its edge. So a ring of points far out, sent to the map and back, traces
  // the planet's outline on screen, tilted or not; it is drawn here as a
  // glowing line, every frame the map draws. Off the flat map, and wherever
  // the edge is off screen, nothing is drawn.
  let rim = null;
  function drawRim() {
    if (!rim) return;
    const box = map.getContainer(), w = box.clientWidth, h = box.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    if (rim.width !== Math.round(w * dpr) || rim.height !== Math.round(h * dpr)) { rim.width = Math.round(w * dpr); rim.height = Math.round(h * dpr); }
    const g = rim.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    if (!on || isFlat()) return;
    const cx = w / 2, cy = h / 2, R = 20000, N = 120, runs = [];
    let run = [];
    for (let i = 0; i <= N; i++) {
      const t = (i / N) * Math.PI * 2, fx = cx + Math.cos(t) * R, fy = cy + Math.sin(t) * R;
      let p = null;
      try { p = map.project(map.unproject([fx, fy])); } catch (e) { p = null; }
      // A point that comes back where it went out was on the planet: no edge there.
      if (!p || !isFinite(p.x) || !isFinite(p.y) || Math.hypot(p.x - fx, p.y - fy) < 2) { if (run.length > 1) runs.push(run); run = []; continue; }
      run.push(p);
    }
    if (run.length > 1) runs.push(run);
    if (!runs.length) return;
    const c = colours();
    // Soft to sharp: three wide faint passes, then the line itself.
    for (const [lw, col] of [[10, rgba(c.glow, 0.06)], [5, rgba(c.glow, 0.13)], [2.6, rgba(c.line, 0.3)], [1.3, rgba(c.line, 0.95)]]) {
      g.lineWidth = lw; g.strokeStyle = col; g.lineJoin = "round";
      for (const r of runs) { g.beginPath(); g.moveTo(r[0].x, r[0].y); for (let k = 1; k < r.length; k++) g.lineTo(r[k].x, r[k].y); g.stroke(); }
    }
  }
  map.on("render", () => { if (on) drawRim(); });
  map.on("resize", () => { if (on) drawRim(); });

  /* ---------- overlays ---------- */
  let overlays = null;
  function ensureOverlays() {
    if (overlays) return;
    const cv = map.getCanvas();
    const mk = (cls, tag) => { const el = document.createElement(tag || "div"); el.className = cls; return el; };
    const els = [mk("holo-rim", "canvas"), mk("holo-scan"), mk("holo-floor"), mk("holo-crt")];
    els[2].appendChild(document.createElement("i"));
    // Straight after the canvas: over the map drawing, under popups and controls.
    for (const el of els.slice().reverse()) cv.parentNode.insertBefore(el, cv.nextSibling);
    rim = els[0];
    overlays = {};
  }
  // The line along the bottom of the map naming the outlines and grid is gone
  // (asked for 24 September); only the note in the Basemap box is kept.
  function updateText() {
    const n = document.getElementById("holo-note");
    if (n) n.textContent = resNote;
  }

  /* ---------- on and off ---------- */
  function enable() {
    if (on) return;
    on = true;
    ensureLayers(); ensureOverlays(); recolourLayers();
    defenceOff();
    savedSky = map.getSky ? map.getSky() : null;
    if (map.setSky) map.setSky(holoSky());
    savedVis = new Map();
    hideBase();
    glowMarkers();
    showHolo();
    updateText();
    setRes(HOLO.res, resNote);
    perf.samples = []; perf.last = 0;
    drawRim();
  }
  function disable() {
    if (!on) return;
    on = false;
    showHolo();
    drawRim();
    unglowMarkers();
    if (map.setSky && savedSky) map.setSky(savedSky);
    restoreBase();
  }
  // Basemap underneath switched while the hologram is on.
  function setUnder(v) {
    opt.under = v;
    if (!on) return;
    if (v) { restoreBase(); frameOn(); }
    hideBase();
    earthPaint(); showHolo(); updateText();
  }

  /* ---------- speed check: 1:50m -> 1:110m if the glow slows things down ---------- */
  // Frame times are measured while the map is moving, first without the
  // hologram (as a baseline), then with it. If it is both slow and clearly
  // slower than the baseline, the outlines switch to 1:110m and the Basemap
  // box and the readout say so.
  const perf = { base: [], samples: [], last: 0, done: false };
  const median = (a) => { const s = a.slice().sort((x, y) => x - y); return s[s.length >> 1]; };
  map.on("render", () => {
    if (perf.done || !map.isMoving()) { perf.last = 0; return; }
    const t = performance.now();
    if (perf.last) {
      const dt = t - perf.last;
      if (dt < 250) (on ? perf.samples : perf.base).push(dt);
      if (perf.base.length > 200) perf.base.shift();
    }
    perf.last = t;
    if (on && HOLO.res === "50m" && perf.samples.length >= 120) {
      perf.done = true;
      const m = median(perf.samples), b = perf.base.length >= 30 ? median(perf.base) : 0;
      if (m > HOLO.slowFrameMs && m > b * 1.4) {
        console.info(`[culprits] hologram: ${m.toFixed(0)} ms per frame at 1:50m (baseline ${b ? b.toFixed(0) : "?"} ms); switched to 1:110m`);
        setRes("110m", "Switched to 1:110m outlines: 1:50m was slowing panning");
      }
    }
  });

  /* ---------- the switch, in the Basemap box ---------- */
  function addSwitch() {
    const body = document.querySelector('#basemaps .sect[data-sect="basemap"] .sect-body');
    if (!body || document.getElementById("holo-toggle")) return;
    const d = document.createElement("div");
    d.className = "holo-ctl";
    const tick = (id, key, nm, title) =>
      `<label class="layer"${title ? ` title="${title}"` : ""}><input type="checkbox" id="${id}" data-opt="${key}"${opt[key] ? " checked" : ""}><span class="nm">${nm}</span></label>`;
    d.innerHTML =
      `<div class="holo-row">` +
      `<label class="layer" title="A wireframe screen: country outlines, no imagery. Your layers stay on.">` +
      `<input type="checkbox" id="holo-toggle"${on ? " checked" : ""}><span class="nm">Hologram view</span></label>` +
      tick("holo-under", "under", "Basemap underneath", "The basemap ticked above, under the hologram, dimmed by a navy wash") +
      `<button type="button" class="holo-fold" id="holo-fold" title="Roll the hologram's options up or down"` +
      ` aria-expanded="${opt.fold ? "false" : "true"}"${on ? "" : " hidden"}>${opt.fold ? "&#9656;" : "&#9662;"}</button></div>` +
      `<p class="holo-note" id="holo-note"></p>` +
      `<div class="holo-sub"${on && !opt.fold ? "" : " hidden"}>` +
      tick("holo-grat", "grat", `${HOLO.gridStep}° grid lines`) +
      tick("holo-floorbox", "floor", "Grid floor") +
      tick("holo-stars", "stars", "Stars") +
      tick("holo-names", "names", "Place names", "Country, city and sea names, in pale text for the dark screen") +
      tick("holo-detail", "detail", "Close-in detail", "OpenStreetMap coasts, borders, rivers, roads and buildings, and relief shading, drawn as wireframe as you zoom in") +
      tick("holo-fx", "fx", "80s effects", "Colour fringe on the outlines, darker tube edges") +
      `</div>` +
      `<label class="holo-tint"${on && opt.under && !opt.fold ? "" : " hidden"}>wash <input type="range" id="holo-tint" min="0" max="90" step="5" value="${opt.tint}"><span id="holo-tint-n">${opt.tint}%</span></label>`;
    body.appendChild(d);
    const sync = () => {
      d.querySelector(".holo-sub").hidden = !on || opt.fold;
      d.querySelector(".holo-tint").hidden = !(on && opt.under && !opt.fold);
      const f = d.querySelector("#holo-fold");
      f.hidden = !on;
      f.innerHTML = opt.fold ? "&#9656;" : "&#9662;";
      f.setAttribute("aria-expanded", opt.fold ? "false" : "true");
    };
    // The options roll up and down with the view still on.
    d.querySelector("#holo-fold").addEventListener("click", (e) => {
      e.preventDefault(); e.stopPropagation();
      opt.fold = !opt.fold; keepOpt(); sync();
    });
    d.addEventListener("change", (e) => {
      const t = e.target;
      if (t.id === "holo-toggle") { t.checked ? enable() : disable(); sync(); return; }
      const key = t.dataset && t.dataset.opt;
      if (!key) return;
      if (key === "under") setUnder(t.checked);
      else {
        opt[key] = t.checked;
        if (key === "detail") outlineFade();
        showHolo(); updateText();
      }
      keepOpt(); sync();
    });
    d.addEventListener("input", (e) => {
      if (e.target.id !== "holo-tint") return;
      opt.tint = +e.target.value;
      d.querySelector("#holo-tint-n").textContent = opt.tint + "%";
      earthPaint(); showHolo(); keepOpt();
    });
    // The readout names the basemap underneath; keep it right when it changes.
    body.addEventListener("change", (e) => { if (e.target && e.target.name === "basemap") updateText(); });
    updateText();
  }
  // The Basemap box is filled in once the map has loaded; the switch is added
  // as soon as it appears, and again if the box is ever rebuilt.
  addSwitch();
  // The Place names box in the View section was switched.
  document.addEventListener("culprits-names", () => { if (on) showHolo(); });
  const box = document.getElementById("basemaps");
  if (box && window.MutationObserver) new MutationObserver(addSwitch).observe(box, { childList: true, subtree: true });
})();
</script>
</body>
</html>
